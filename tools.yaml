# Dashboard groups, each with its tools. Each tool is served at its hyphenated name; slug stays its build ID
# and redirects to that name. Listed in this order. A group's
# `alternative:` is its heading under the dashboard's "Alternative naming".
#
#   repo:   GitHub repo to download the web build from
#   tag:    release tag to pin (optional; default: the newest non-prerelease that has a matching asset, else
#           the newest pre-release that has one, for repos that have only pre-releases so far)
#   branch: the branch the head channel builds (optional; default: main)
#   paths:  only commits changing these paths count as new head versions (optional; default: any)
#   asset:  regex matching the release asset name (optional; default: "-web-.*\.zip$")
#   alternative: the commercial app it's an open-source alternative to, shown as "Alternative to …" and
#           under the dashboard's "Alternative naming". Its icon there is icons/alternatives/<slug>.svg, an original
#           minimalist tile (a colour and a glyph of what the app does), not the product's logo.
#   icon:   dashboard icon: the project's own, also copied in as the tool page's favicon
#   accent, base: a light and a dark brand color, used for the dashboard hover
#   theme:  script that makes the app follow the browser's light/dark preference (optional; see themes/)
#   patches: source patches for the app's own build (optional; see scripts/build.mjs). Every app is built
#           from source with a speed-first wasm-opt -O3; when its build is missing or failed, the site
#           serves the upstream release (with the theme script) instead.
#   build: false uses upstream releases only (already optimized by the app's own CI)
#   isolated: true sends the cross-origin isolation headers required by shared-memory WASM
#   live:   the source folder that gets patches/live/playground_live.rs, the live-editing adapter the tool's diffs
#           wire in (optional; Honeydew has its own)
#   opens:  file types (extensions) the app is the natural home for: Files shows its icon on them and opens them
#           in it by default (no browser-side Open yet: [])
#   imports: other types its browser build takes in (imports, places, inserts): offered in Files' right-click menu
#
# Run `make fetch` after editing.

groups:
  - name: Creative
    alternative: Adobe Creative Cloud
    tools:
      - slug: photoshop
        name: PhotoCraft
        alternative: Photoshop
        blurb: Layers, masks, adjustments, brushes and real PSD files.
        opens: [psd, psb, psdt, pcraft, png, jpg, jpeg, webp, gif, bmp, tif, tiff, tga, ico, qoi, exr, hdr, heic, heif, afphoto]
        imports: [dng, cr2, cr3, nef, nrw, arw, pef, orf, rw2, raf, svg, svgz, pbm, pgm, ppm, pam, pfm, abr, grd, aco, ase, afdesign, afpub]
        repo: storytold/photocraft
        icon: icons/photocraft.png
        theme: themes/photoshop.js
        patches: patches/photoshop.yaml
        live: apps/photocraft-web/src
        accent: "#31A8FF"
        base: "#001E36"

      - slug: illustrator
        name: VectorCraft
        alternative: Illustrator
        blurb: Vector paths, type and artboards.
        opens: [vectorcraft, drawcraft, ai, ait, eps, svg, svgz, emf, wmf, afdesign]
        imports: [pdf, png, jpg, jpeg, gif, webp, tif, tiff, bmp, dxf, txt, gpl, ase]
        repo: storytold/vectorcraft
        icon: icons/vectorcraft.png
        theme: themes/illustrator.js
        patches: patches/illustrator.yaml
        live: crates/ui-egui/live
        accent: "#FF9A00"
        base: "#330000"

      - slug: indesign
        name: DesignCraft
        alternative: InDesign
        blurb: Page layout and publishing.
        opens: [designcraft, idml]
        imports: [png, jpg, jpeg, gif, webp, tif, tiff, bmp, psd, svg, pdf, ai, txt, docx, rtf, md, xlsx, ase]
        repo: storytold/designcraft
        icon: icons/designcraft.png
        theme: themes/indesign.js
        patches: patches/indesign.yaml
        live: apps/designcraft-web/src
        accent: "#FF3366"
        base: "#49021F"

      - slug: lightroom
        name: LightCraft
        alternative: Lightroom
        blurb: Photo library and raw development.
        opens: [dng, cr2, cr3, nef, nrw, arw, pef, orf, rw2, raf, rwl, raw, iiq, crw, mrw, x3f, kdc, mos, erf]
        imports: [jpg, jpeg, png, tif, tiff, webp, psd, jxl, gif, bmp, heic, avif]
        repo: storytold/lightcraft
        icon: icons/lightcraft.png
        patches: patches/lightroom.yaml
        live: apps/lightcraft-web/src
        accent: "#31A8FF"
        base: "#001E36"

      - slug: lightroom-classic
        name: LightCraft Classic
        alternative: Lightroom Classic
        blurb: Catalog, Develop, Map, Book, Slideshow, Print and Web modules.
        opens: [dng, cr2, cr3, nef, nrw, arw, pef, orf, rw2, raf, rwl, raw, iiq, crw, mrw, x3f, kdc, mos, erf]
        imports: [jpg, jpeg, png, tif, tiff, webp, psd, jxl, gif, bmp, heic, avif]
        repo: emmertex/lightcraft-classic
        icon: icons/lightcraft-classic.svg
        patches: patches/lightroom-classic.yaml
        live: apps/web/src
        accent: "#31A8FF"
        base: "#001E36"

      - slug: premiere
        name: FilmCraft
        alternative: Premiere Pro
        blurb: Video editing, color and sound.
        opens: [fcproj, mp4, m4v, mov, mkv, webm, avi, mxf, mts, m2ts, mpg, mpeg, 3gp]
        imports: [wav, aif, aiff, mp3, m4a, aac, flac, ogg, opus, png, jpg, jpeg, gif, webp, tif, tiff, bmp, srt, vtt, scc, edl, fcpxml, otio, aaf, omf]
        repo: storytold/filmcraft
        icon: icons/filmcraft.png
        theme: themes/premiere.js
        patches: patches/premiere.yaml
        live: crates/project/src
        accent: "#9999FF"
        base: "#00005B"

      - slug: after-effects
        name: EffectCraft
        alternative: After Effects
        blurb: Compositions, keyframes, effects and expressions.
        opens: [ecproj]
        imports: [mp4, mov, m4v, mkv, webm, png, jpg, jpeg, gif, webp, tif, tiff, bmp, exr, wav, aif, aiff, mp3, flac, ogg, opus, svg, pdf, ai, eps, psd, psb, gltf, glb, obj, csv, tsv]
        repo: storytold/effectcraft
        icon: icons/effectcraft.png
        theme: themes/after-effects.js
        patches: patches/after-effects.yaml
        live: crates/engine/src
        accent: "#9999FF"
        base: "#00005B"

      - slug: acrobat
        name: PdfCraft
        alternative: Acrobat Pro
        blurb: Read, organize, combine, split and secure PDFs.
        opens: [pdf]
        imports: [png, jpg, jpeg, tif, tiff, gif, bmp, jp2, j2k, jpx, txt]
        repo: storytold/pdfcraft
        patches: patches/acrobat.yaml
        live: crates/ui-egui/live
        icon: icons/pdfcraft.png
        theme: themes/acrobat.js
        accent: "#FA0F00"
        base: "#3A0400"

  - name: Office
    alternative: Microsoft Office
    tools:
      - slug: word
        name: WordCraft
        alternative: Word
        blurb: Writing and document design.
        opens: [docx, docm, dotx, dotm, odt, rtf, txt, md, html, htm]
        imports: [png, jpg, jpeg, gif, webp, bmp]
        repo: storytold/wordcraft
        icon: icons/wordcraft.svg
        theme: themes/word.js
        patches: patches/word.yaml
        live: apps/wordcraft-web/src
        accent: "#41A5EE"
        base: "#0B2557"

      - slug: excel
        name: GridCraft
        alternative: Excel
        blurb: Spreadsheets and data.
        opens: [xlsx, xlsm, xltx, xltm, csv, tsv]
        imports: [txt, json, tab]
        repo: storytold/gridcraft
        icon: icons/gridcraft.svg
        theme: themes/excel.js
        patches: patches/excel.yaml
        live: crates/ui-egui/src
        accent: "#33C481"
        base: "#062E19"

      - slug: powerpoint
        name: DeckCraft
        alternative: PowerPoint
        blurb: Presentations and slide shows.
        opens: [pptx, potx, ppsx, deckcraft]
        imports: [png, jpg, jpeg, gif, webp, bmp, tif, tiff, wav, mp3, m4a, aac, flac, ogg, opus, aif, aiff, mp4, m4v, mov, webm, txt, md]
        repo: storytold/deckcraft
        icon: icons/deckcraft.png
        theme: themes/powerpoint.js
        patches: patches/powerpoint.yaml
        live: apps/deckcraft-web/src
        accent: "#FF8F6B"
        base: "#3D1308"

      - slug: onenote
        name: NoteCraft
        alternative: OneNote
        blurb: Notebooks, sections and pages for notes, kept as plain folders of HTML and Markdown pages.
        # A page is an index.html or index.md in its own folder; the web build keeps the notebooks in Files at
        # browser:/NoteCraft. Upstream has no releases yet, so like MaterialCraft it has the head channel only;
        # patches/onenote.yaml adds the web build.
        opens: [html, md]
        imports: []
        repo: AlienTechSoftware/notecraft
        # What the web build compiles (Cargo.lock: dependency changes; the engine embeds docs/demo/DemoNotebook):
        # README, other docs and CI commits don't rebuild it.
        paths: [crates, assets, docs/demo/DemoNotebook, Cargo.toml, Cargo.lock, rust-toolchain.toml]
        patches: patches/onenote.yaml
        live: crates/ui-egui/src/app
        icon: icons/notecraft.png
        accent: "#CA64EA"
        base: "#2B0B40"

      - slug: outlook
        name: MailCraft
        alternative: Outlook
        blurb: Mail, calendar, people and tasks.
        # Its browser build opens a sample mailbox kept in the browser (no mail server), and takes no files.
        opens: []
        imports: []
        repo: MonkeySaint/mailcraft
        # Its web zip is mailcraft-<version>-web.zip; its branch is master.
        asset: '-web\.zip$'
        branch: master
        icon: icons/mailcraft.svg
        patches: patches/outlook.yaml
        accent: "#28A8EA"
        base: "#0A2767"

  - name: 3D
    tools:
      - slug: autocad
        name: CADCraft
        alternative: AutoCAD
        blurb: Computer-aided design and drafting.
        opens: []
        imports: []
        repo: storytold/cadcraft
        patches: patches/autocad.yaml
        live: crates/doc/src
        icon: icons/cadcraft.png
        accent: "#E85984"
        base: "#3A0716"

      - slug: fusion-360
        name: SolidCraft
        alternative: Fusion 360
        blurb: Parametric 3D modeling with sketches, constraints and solids.
        # Designs, and STEP/IGES/STL/3MF/OBJ (each opens as a new design, or joins one that has features).
        opens: [solidcraft, solvecraft, step, stp, iges, igs, stl, 3mf, obj]
        imports: []
        repo: bherbruck/solvecraft
        # Its web zip is solidcraft-web-<version>.zip (the default pattern; the old solvecraft-<tag>-web.zip naming
        # stopped at v0.1.1); nightlies are pre-releases.
        # The web app and what it compiles (dependency changes show up in Cargo.lock; the root Cargo.toml holds
        # the release profile and the vendored truck patches): CI, docs and desktop-only commits don't rebuild it.
        paths: [apps/solidcraft-web, crates, vendor, Cargo.lock, Cargo.toml]
        icon: icons/solidcraft.svg
        theme: themes/fusion-360.js
        patches: patches/fusion-360.yaml
        live: apps/solidcraft-web/src
        accent: "#FF7A1F"
        base: "#3A1806"

      - slug: substance-painter
        name: SubCraft
        alternative: Substance Painter
        blurb: Paint 3D models with layered materials, masks and textures.
        opens: []
        imports: []
        repo: Aalzard/subcraft
        patches: patches/substance-painter.yaml
        live: crates/ui/src
        icon: icons/subcraft.png
        accent: "#FF7A1A"
        base: "#3A1A06"

      - slug: substance-designer
        name: MaterialCraft
        alternative: Substance Designer
        blurb: Build tileable procedural materials from nodes, with noises, patterns, filters and PBR maps.
        # Material graphs (.mcg) and published packages (.mca). Upstream releases are desktop-only (no web zip), so
        # like SubCraft it has the head channel only; patches/substance-designer.yaml adds the web build.
        opens: [mcg, mca]
        imports: []
        repo: PiJellyPin/MaterialCraft
        # What the web build compiles: README and docs commits don't rebuild it.
        paths: [src, assets, build.rs, Cargo.toml]
        patches: patches/substance-designer.yaml
        live: src
        icon: icons/materialcraft.png
        accent: "#7A4ED6"
        base: "#1C0E3A"

  - name: Music
    tools:
      - slug: pro-tools
        name: SoundCraft
        alternative: Avid Pro Tools
        blurb: Recording, editing and mixing audio.
        opens: []
        imports: []
        repo: storytold/soundcraft
        patches: patches/pro-tools.yaml
        live: crates/model/src
        branch: main
        # The web app and the crates it compiles (dependency changes show up in Cargo.lock): CI, docs and
        # desktop-only commits don't rebuild it. One GitHub API request per path per check.
        paths: [apps/soundcraft-web, crates, Cargo.lock]
        icon: icons/soundcraft.svg
        accent: "#A673FF"
        base: "#1F0B40"

      - slug: fl-studio
        name: Lemon Studio
        alternative: FL Studio (experimental)
        blurb: Compose and arrange music with a piano roll, mixer and built-in instruments.
        # Shown when the app opens (shell/topbar.js), until someone ticks "Don't show this again".
        notice:
          title: Early preview
          text: This app is still under heavy development and is only available as an early preview. It isn't meant for real-world use yet. Features are missing, things will break, and your work may be lost. Don't rely on it for anything important.
        opens: []
        imports: []
        repo: daijro/Lemon-Studio-web
        asset: '^lemon-studio-web\.zip$'
        build: false
        isolated: true
        icon: icons/lemon-studio.png
        accent: "#F8D84A"
        base: "#36300C"

      - slug: fl-studio-mobile
        name: Honeydew
        alternative: FL Studio Mobile
        blurb: Compose, sequence and mix music with built-in instruments.
        opens: [flm, mid, midi]
        imports: [flp, zip]
        repo: daijro/honeydew
        icon: icons/honeydew.svg
        patches: patches/fl-studio-mobile.yaml
        accent: "#CDE397"
        base: "#263513"

      - slug: ableton-live
        name: Suhina
        alternative: Ableton Live
        blurb: Launch clips, arrange and mix music with built-in instruments and effects.
        # Its own projects and Live Sets (imported). Upstream publishes desktop nightlies only, so like NoteCraft it
        # has the head channel only; patches/ableton-live.yaml adds the web build.
        opens: [suhina, als]
        imports: [wav, aif, aiff, flac, mp3, ogg, mid, midi]
        repo: suhina-daw/suhina-daw
        # What the web build compiles (Cargo.lock: dependency changes): docs, CI and the desktop apps' commits don't
        # rebuild it. One GitHub API request per path per check.
        paths: [crates, devices, assets, Cargo.toml, Cargo.lock]
        patches: patches/ableton-live.yaml
        live: crates/session/src
        icon: icons/suhina.svg
        accent: "#FFD97D"
        base: "#3A2F10"

  - name: Other
    tools:
      - slug: figma
        name: FigCraft
        alternative: Figma
        blurb: Interface design, components and prototypes.
        # The web build has no file dialogs; dropped files only import after creating a design.
        opens: []
        imports: []
        repo: storytold/figcraft
        icon: icons/figcraft.png
        theme: themes/figma.js
        patches: patches/figma.yaml
        live: crates/engine/src
        accent: "#02DA96"
        base: "#062E22"

      - slug: mspaint
        name: SelfPaint
        alternative: Microsoft Paint (experimental)
        blurb: Draw and paint with a pencil, brushes, an eraser, fills, shapes and text.
        # Shown when the app opens (shell/topbar.js), until someone ticks "Don't show this again".
        notice:
          title: Early preview
          text: This app is still under heavy development and is only available as an early preview. It isn't meant for real-world use yet. Features are missing, things will break, and your work may be lost. Don't rely on it for anything important.
        # Its release's web zip is selfpaint-web.zip (not -web-<version>.zip), built from files that aren't in the
        # repository; patches/mspaint.yaml adds the web build Playground makes from the sources on both channels.
        opens: [png, jpg, jpeg, sproj]
        imports: []
        repo: selfbin/selfpaint
        asset: '-web\.zip$'
        # What the web build compiles (Cargo.lock: dependency changes): README, CI and icon commits don't rebuild it.
        paths: [src, assets, Cargo.toml, Cargo.lock]
        patches: patches/mspaint.yaml
        live: src/app
        icon: icons/selfpaint.png
        accent: "#A77BF0"
        base: "#410D7C"
