# Rule 1: keep the page responsive while LightCraft prepares the photos next to the one on screen.
# What it's for: once a photo is in the loupe or Develop view, LightCraft prefetches its filmstrip neighbours
#   (panels/detail.rs → Renderer::prefetch). Every other render goes to the browser build's render workers, but
#   prefetch always used the local job pool, which in the browser runs one job per frame on the page's only
#   thread (Renderer::poll → JobPool::run_inline). Preparing one demo photo there froze the whole page, top
#   bar included, for about 5 s right after opening; a large raw file freezes it longer. The source it decoded
#   also stayed in the page's own cache, which the workers never read.
# How: when the renderer has an offload (the workers), a prefetch is queued and dispatched to a worker exactly
#   like Renderer::request does; the worker keeps the decoded source and the photo's next render goes back to
#   it (the workers' affinity). Without workers (desktop, or none started) nothing changes.
# Verify: open /lightroom/ in a fresh browser profile and leave it on the demo library's first photo: a 20 ms
#   setInterval never stalls (it stopped for ~4.8 s about 7 s in), web.stats `workers.remoteJobs` counts the
#   prefetches, and stepping to the next photo still shows it at once.
# If upstream changes: delete this rule once Renderer::prefetch (crates/ui-egui/src/render.rs) hands its job to
#   `self.offload` itself (or no longer calls `self.pool.submit`). If only the line moved, re-anchor on the
#   prefetch's pool submit. Match its call site, preserving either upstream job-result representation.
- file: crates/ui-egui/src/render.rs
  find: '(pub fn prefetch\b[\s\S]*?)(self\.pool\.submit\()'
  replace: |-
    $1if self.offload.is_some() {
                self.seq += 1;
                self.queue.retain(|q| q.slot != slot);
                self.queue.push(Queued { slot, priority, seq: self.seq, job });
                self.dispatch();
                return;
            }
            $2

# Rule 2: drop the notice LightCraft shows on every launch.
# What it's for: for 8 s after opening, "LightCraft in the browser is experimental. Your library is kept in this
#   browser's storage: keep your original photos elsewhere and back up with File ▸ Back Up Library…." covered the
#   photo, with a box for the ▸ its font can't draw. The warning that matters stays: the one rule 3 fixes, shown
#   only when the browser hasn't granted persistent storage, so it may really delete the library.
# How: the `if backend.is_some() { notice(…) }` in WebApp::new goes.
# Verify: open /lightroom/: no notice at the bottom of the photo on a browser that grants persistent storage.
# If upstream changes: delete this rule once that notice is gone or no longer shown on every launch; if only its
#   wording changed, re-anchor on the new text.
- file: apps/*-web/src/web.rs
  find: '\n[ \t]*if backend\.is_some\(\) \{\s*notice\(\s*"LightCraft in the browser is experimental\.[^;]*;\s*\}'
  replace: ''

# Rule 3: write the menu path in the storage warning with characters LightCraft's font has.
# What it's for: "use File ▸ Back Up Library… now and then." showed a box for ▸.
# How: "File > Back Up Library".
# Verify: in a browser that doesn't grant persistent storage (a fresh headless Chromium profile), the notice at
#   the bottom of the photo reads "use File > Back Up Library now and then." with no box.
# If upstream changes: delete this rule once the notice no longer has the ▸, or its font draws it.
- file: apps/*-web/src/web.rs
  find: 'File ▸ Back Up Library… now and then'
  replace: 'File > Back Up Library now and then'

# Live editing in Playground sessions (patches/lightroom/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session edit one LightCraft library together (the catalog: ratings, develop
#   settings, History, albums…), see each other's pointers and selections, and get each other's imported photos.
# How: the adapter lives in new files: apps/lightcraft-web/src/live.rs (the shared document, merge, adopt, media,
#   presence, the session's own library folder), apps/lightcraft-web/src/web/live.rs (the kept runner and the wrapper
#   that ends each frame with the session's frame hook) and crates/catalog/src/playground.rs (hooks the web build sets;
#   inert elsewhere). The playground-live crate (patches/live/kit) gives the session and the presence look (pointers,
#   name and value tags, ghosts, outlines, easing); its Live trait is implemented on a wrapper of the app (live.rs `App`), the app
#   being another crate's type. These rules only declare them and call in, each one line at the end of a file, under
#   [dependencies] or right after a function's signature.
# Verify: node scripts/build.mjs check lightroom head|release, `cargo test -p lightcraft-web --lib live::`, then the e2e
#   (tests/live-apps/lightroom.mjs).
# If upstream changes: when a function named below is renamed, anchor on its new signature; when WebApp, its `app`,
#   `originals` or `backend` fields are renamed, follow them in web/live.rs.
#
# The adapter module (web build; native tests), and the playground-live crate with its presence look as a dependency.
- live: true
  file: apps/lightcraft-web/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
- live: true
  file: apps/lightcraft-web/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
# The web entry: its live module, the runner kept, the app wrapped, and a session's own library folder (an invitation
# link's ?pg-session=<room>) instead of this browser's library, so joining never touches it.
- live: true
  file: apps/lightcraft-web/src/web.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\nmod live;\n"
- live: true
  file: apps/lightcraft-web/src/web.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'live::runner()'
- live: true
  file: apps/lightcraft-web/src/web.rs
  find: 'Ok\(Box::new\((?=\s*WebApp::new\b)'
  replace: 'Ok(live::wrap('
- live: true
  file: apps/lightcraft-web/src/web.rs
  find: 'for\s+name\s+in\s+LIBRARY_FILES\b'
  before: "if let Some(dir) = crate::live::session_library() { lib_dir = dir; }\n        "
# The hooks module; the id allocators: while connected, an id nobody else adding something at once picks.
- live: true
  file: crates/catalog/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (hooks the web build sets).\npub mod playground;\n"
- live: true
  file: crates/catalog/src/lib.rs
  find: 'pub\s+fn\s+alloc_photo_id\s*\(\s*&mut\s+self\s*\)[^{]*\{'
  after: "\n        if let Some(id) = crate::playground::fresh(&mut self.next_photo) { return PhotoId(id); }"
- live: true
  file: crates/catalog/src/lib.rs
  find: 'pub\s+fn\s+alloc_album_id\s*\(\s*&mut\s+self\s*\)[^{]*\{'
  after: "\n        if let Some(id) = crate::playground::fresh(&mut self.next_album) { return AlbumId(id); }"
- live: true
  file: crates/catalog/src/lib.rs
  find: 'pub\s+fn\s+alloc_stack_id\s*\(\s*&mut\s+self\s*\)[^{]*\{'
  after: "\n        if let Some(id) = crate::playground::fresh(&mut self.next_stack) { return StackId(id); }"
# Automatic versions: while connected, made by whoever edited the photo (Session::commit notes it), not by everyone
# who leaves the photo after the edit arrived.
- live: true
  file: crates/engine/src/lib.rs
  find: 'pub\s+fn\s+commit\s*\(\s*&mut\s+self\b[^{]*\{'
  after: "\n        lightcraft_catalog::playground::committed(&op);"
- live: true
  file: crates/engine/src/lib.rs
  find: 'pub\s+fn\s+auto_version\s*\(\s*&mut\s+self\b[^{]*\{'
  after: "\n        if lightcraft_catalog::playground::others_edit(id) { return; }"
# Undo and Redo: while connected they are the session's (this person's own steps), offered whatever the native
# history holds; LightcraftApp::run, which menus and shortcuts go through, hands them over. The Presets panel's
# Amount slider re-applies a preset by undoing it natively: not offered while connected.
- live: true
  file: crates/engine/src/{cmd.rs,cmd/mod.rs}
  find: 'pub\s+fn\s+can_undo\s*\([^{]*\{'
  after: "\n    if lightcraft_catalog::playground::live() { return Ok(()); }"
- live: true
  file: crates/engine/src/{cmd.rs,cmd/mod.rs}
  find: 'pub\s+fn\s+can_redo\s*\([^{]*\{'
  after: "\n    if lightcraft_catalog::playground::live() { return Ok(()); }"
- live: true
  file: crates/ui-egui/src/{lib.rs,app.rs}
  find: 'pub\s+fn\s+run\s*\(\s*&mut\s+self\b[^{]*\{'
  after: "\n        if matches!(id, \"edit.undo\" | \"edit.redo\") && lightcraft_catalog::playground::undo(id == \"edit.redo\") { return Ok(Default::default()); }"
- live: true
  file: crates/ui-egui/src/panels/presets.rs
  find: 'fn\s+is_current\s*\(\s*&self\b[^{]*\{'
  after: "\n        if lightcraft_catalog::playground::live() { return false; }"
