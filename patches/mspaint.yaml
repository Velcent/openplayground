# SelfPaint in the browser. Upstream's sources build a desktop window only (its web release zip was built from files
# not in the repository); these patches add the web build Playground serves.
#
# patches/mspaint/web.diff adds new files only:
#   Trunk.toml, index.html   the web build at the repository root (build.mjs runs trunk there): the `selfpaint` binary
#                            on the page's canvas.
#   src/app/web.rs           the browser side, a child of the app module: web-time's clock, a never-shown stand-in for
#                            rfd's FileDialog, the preferences in localStorage, Open/Save/Save project through Playground's
#                            `globalThis.playgroundFiles` (Files, "From computer…", downloads), "Open in SelfPaint", the
#                            WebRunner, and the stroke being drawn put on screen as it goes (upstream uploads the picture
#                            only once a stroke ends, so it appeared on release).
# Native builds see none of this: every rule adds wasm-only lines.

# Rule 1/7: the web dependencies of src/app/web.rs (all already in Cargo.lock through eframe).
# Verify: build.mjs check. If upstream adds them itself, drop the duplicates here.
- file: Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nweb-time = \"1\"\nwasm-bindgen = \"0.2\"\nwasm-bindgen-futures = \"0.4\"\njs-sys = \"0.3\"\nweb-sys = { version = \"0.3\", features = [\"Window\", \"Document\", \"Element\", \"HtmlCanvasElement\", \"Navigator\", \"Storage\"] }\n"

# Rules 2-3/7: the desktop entry point stays out of the web build, which starts the app on the page instead.
# If upstream changes: anchor on wherever the binary's `fn main` lives.
- file: src/main.rs
  find: '^fn\s+main\s*\('
  before: "#[cfg(not(target_arch = \"wasm32\"))]\n"
- file: src/main.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build (patches/mspaint.yaml): the app on the page's canvas.\n#[cfg(target_arch = \"wasm32\")]\nfn main() {\n    app::web::start();\n}\n"

# Rule 4/7: the browser side, and the app module's `std`, `rfd` and `craft_settings` names pointing at its shims (a
# local name shadows the crate's in that module; everything else in std still comes from the real one).
- file: src/app.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build (patches/mspaint.yaml): the clock, files, dialogs and settings in the browser.\n#[cfg(target_arch = \"wasm32\")]\npub(crate) mod web;\n#[cfg(target_arch = \"wasm32\")]\nuse web::{craft_settings, rfd, std_web as std};\n"

# Rules 5-7/7: Open, Save (PNG) and Save project go through the page (the desktop ones run a native dialog on a thread).
# Verify: Open lists the PNGs in Files; Save asks where once, then saves back. If upstream renames them, follow them.
- file: src/app.rs
  find: '\bfn\s+spawn_open\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        return web::open(self);"
- file: src/app.rs
  find: '\bfn\s+spawn_save_png\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        return web::save(self, false);"
- file: src/app.rs
  find: '\bfn\s+spawn_save_project\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        return web::save(self, true);"


# Live editing in Playground sessions (patches/mspaint/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session paint on the same picture at once: every stroke, shape, fill and text
#   reaches the others, two people's strokes merge pixel by pixel (both stay, the later on top), each person's Ctrl+Z
#   takes back only their own, and each sees the others' pointers and the strokes, shapes and text they are making, in
#   their colour, as they happen.
# How: the adapter lives in new files: src/app/live.rs (the shared picture as 64×64 tiles, its merge, the session's
#   frame, the web runner and the adapter) and src/app/live/peers.rs (presence: pointers, name tags and easing the
#   kit's, strokes, dashed shapes and text SelfPaint's own). The playground-live crate (patches/live/kit, copied to the
#   checkout's playground-live/) gives presence lists and the presence look. These rules only declare it and call in,
#   one line each, and add the crate as a dependency.
# Verify: node scripts/build.mjs check mspaint head (and LIVE=0), the e2e (tests/live-apps/mspaint.mjs) and
#   `cargo test live`.
# If upstream changes: when a line named below changes, anchor on its new spelling; if SelfPaintApp renames the fields
#   live.rs uses (doc, drag, view, texture, texture_dirty, history, shape_preview, text, text_size) or DragState's
#   Stroke { last }, follow them there.
#
# The adapter's dependency, for the web and for native tests, under target spellings nobody else uses (rule 1 has
# `all(…)`): the playground-live crate with its presence look (`egui`).
- live: true
  file: Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(any(target_arch = \"wasm32\"))'.dependencies]\nplayground-live = { path = \"playground-live\", features = [\"egui\"] }\n\n[target.'cfg(not(target_arch = \"wasm32\"))'.dev-dependencies]\nplayground-live = { path = \"playground-live\", features = [\"egui\"] }\n"
# The adapter module, a child of the app's module so it reaches SelfPaintApp.
- live: true
  file: src/app.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only, and its native tests).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
# Each change to the picture counts (the shell then hears of it once no stroke is under way).
- live: true
  file: src/app.rs
  find: '\bfn\s+mark_doc_dirty\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        live::touch();"
# Undo and Redo: in a session they go to the session.
- live: true
  file: src/app.rs
  find: '\bfn\s+undo\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        if live::undo(false) {\n            return;\n        }"
- live: true
  file: src/app.rs
  find: '\bfn\s+redo\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")]\n        if live::undo(true) {\n            return;\n        }"
# The ribbon's Undo and Redo stay enabled in a session.
- live: true
  file: src/app.rs
  find: '\bevents\s*=\s*crate::ribbon::show\('
  before: "#[cfg(target_arch = \"wasm32\")]\n                    if live::connected() {\n                        (ribbon_state.can_undo, ribbon_state.can_redo) = (true, true);\n                    }\n                    "
# The canvas: after the picture and this person's shape preview, the others' marks (and this person's pointer noted).
- live: true
  file: src/app.rs
  find: 'self\.show_text_editor\(\s*ui\s*,\s*sheet\s*\)\s*;'
  before: "#[cfg(target_arch = \"wasm32\")]\n        live::paint(self, ui, &painter, sheet);\n        "
# The web entry (src/app/web.rs, from web.diff): the runner kept for the adapter, and the app eframe runs wrapped
# (live::web::wrap: the app's frame, then the session's). If that file changes: the runner is the one `start` creates,
# and `wrap` takes the `Web` the creator returns.
- live: true
  file: src/app/web.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'super::live::web::runner()'
- live: true
  file: src/app/web.rs
  find: 'Ok\(Box::new\((Web::new\([^;]*\))\)\)'
  replace: 'Ok(super::live::web::wrap($1))'
