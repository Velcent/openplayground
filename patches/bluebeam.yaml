# Rule 1: follow the browser's light or dark preference until a theme is picked.
# What it's for: MarkupCraft's Theme preference (Preferences > General) defaulted to Dark, so it stayed dark on a
#   light system, unlike the other apps here.
# How: the preference's default is "system", its System choice. The app then follows egui's system theme, which
#   eframe reads from the browser's prefers-color-scheme. A theme picked in Preferences stays as before.
# Verify: open /bluebeam/ in a fresh browser profile with the system in light mode: the app is light. With the
#   system in dark mode it is dark.
# If upstream changes: delete this rule once the default is "system". If the line moved, re-anchor on the
#   theme field of the prefs' Default impl (crates/engine/src/prefs.rs).
- file: crates/engine/src/prefs.rs
  find: '(\n\s*theme: )"dark"(\.into\(\),)'
  replace: '$1"system"$2'
