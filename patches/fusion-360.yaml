# Follow the browser's light/dark preference at startup, unless the user picked a theme in the app (the
# toolbar's sun/moon or Preferences; SolveCraft keeps it in localStorage['solvecraft.prefs']). The same rule as
# themes/fusion-360.js, which fetch.mjs only adds to the upstream release (our builds of patched apps set the
# theme themselves), sharing its marker key: the theme last set here; a saved theme that differs from it was
# picked in the app.
# Runs right after the saved preferences are loaded, before the app is handed to eframe.
- file: apps/*-web/src/**/*.rs
  find: 'if let Some\(rs\) = &cc\.wgpu_render_state'
  before: |-
    // playground (patches/fusion-360.yaml): the browser's light/dark preference.
                            if let Some(w) = web_sys::window() && let Ok(Some(st)) = w.local_storage() {
                                const MARKER: &str = "playground.solvecraft.seededDark";
                                let seeded = st.get_item(MARKER).ok().flatten();
                                if seeded.is_none_or(|s| s == app.ui.dark.to_string()) {
                                    app.ui.dark = w.match_media("(prefers-color-scheme: dark)").ok().flatten().is_some_and(|m| m.matches());
                                    let _ = st.set_item(MARKER, &app.ui.dark.to_string());
                                }
                            }
                            


# The 3D viewport in Chrome's WebGPU.
# What it's for: the viewport shader's surface-analysis colours call dpdx/dpdy behind a branch on the
#   front_facing builtin. Chrome's WGSL compiler rejects that ("'dpdx' must only be called from uniform
#   control flow"), so the "sc_viewport" shader module and every pipeline built from it are invalid: each frame
#   with the viewport fails to submit and the canvas stays blank once a design is open. (naga, behind desktop
#   Vulkan/Metal and the browser's WebGL2 path, doesn't enforce the rule, so upstream never sees it.)
# How: WGSL's own switch for that check, a `diagnostic(off, derivative_uniformity);` directive at the top of
#   the shader source (naga accepts it too, so `?webgl` keeps working). The derivatives are only used for the
#   curvature colours, where a non-uniform result at most speckles a pixel. The source is the SHADER string in
#   gpu.rs up to v0.1.1, and assets/shaders/viewport.wgsl (include_str!'d into SHADER) after it: the rule takes
#   whichever the version has.
# Verify: open the page in Chrome (WebGPU), New Design, S → "Box" → OK: the box shows in the viewport, and the
#   console has no "Invalid ShaderModule \"sc_viewport\"" warnings. Then the same with ?webgl.
# If upstream changes: put the directive first in whatever WGSL source the viewport's shader module is built
#   from; delete this rule if upstream adds it or moves the derivatives out of the branch.
- file: [crates/ui-egui/src/**/*.rs, assets/shaders/viewport.wgsl]
  find: 'const SHADER: &str = r#"\n|^(?=\s*struct U \{)'
  after: "diagnostic(off, derivative_uniformity);\n"

# A design that arrives by a drop (Files' "Open in Fusion 360" and ?open= hand it over as one) keeps its edits.
# What it's for: the web build keeps a design opened from the computer as a copy in its own browser storage
#   (OPFS, "Files in this browser"), so Save writes there. A dropped design skipped that and opened from an
#   in-memory /upload/ path: Save then wrote nowhere lasting yet marked the design saved, which also deleted the
#   autosave, so the edits were lost on reload. Every file Files opens here arrives that way.
# How: any arriving .solvecraft design gets the copy, not only those from the Open picker (they all open as
#   designs anyway: drop_path opens what isn't STEP or a mesh). Save goes to that copy in SolveCraft's storage,
#   not back to the file in Files.
# Verify: put a .solvecraft in Files, open it in Fusion 360 from there, add a Box, Save, reload: the design is
#   under the start page's Recent ("in this browser") with the box.
# If upstream changes: anchor on where files_tick decides a design's stored path; delete this if dropped designs
#   get stored there too.
- file: apps/*-web/src/**/*.rs
  find: 'if design && intent == Intent::Open \{'
  replace: 'if design {'

# Live editing in Playground sessions (patches/fusion-360/live.diff + the playground-live crate, tools.yaml `live_kit`)
# The adapter lives in apps/solidcraft-web/src/live.rs, on its App around the web entry's Shell (the playground-live
# crate's Live trait can't go on SolveApp here): the session's designs and their merge, adoption, ids, Undo's hand-off,
# presence and the gestures under way (drawn over the viewport at the end of each frame, with dots on the tabs:
# pointers, tags, outlines and easing the kit's, feature ghosts, sketch drags and rubber bands SolidCraft's own), the
# start page's "In this session" list, and the app the web runner starts (that App), which ends each frame with the
# session's hook. A second new file, crates/ui-egui/src/documents_live.rs, gives it the open designs and a tab opened
# behind the others. The rules below only declare them and call in, each one line at the end of a file, after a
# function's signature, before a statement or around a call in the web entry. Native builds behave as before: the hooks
# compile on wasm only (the modules also for the web crate's native tests).
# Verify all: node scripts/build.mjs check fusion-360 head|release, LIVE=0 the same, then the e2e
# (tests/live-apps/fusion-360.mjs) and `cargo test -p solidcraft-web live::`. If upstream renames a function or type
# named below, anchor on its new name.
#
# The web crate's live module, for the browser and its native tests, and its dependency there: the playground-live
# crate (patches/live/kit: the session and the presence look, `egui`).
- live: true
  file: apps/*-web/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (the playground-live crate, patches/live/kit).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
- live: true
  file: apps/*-web/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
# The web entry keeps its runner for the session, and the app it starts is the Shell wrapped by live::wrap in live::App
# (which delegates every eframe::App method, then runs the session's frame hook, gives the runner `as_any_mut`, and
# reaches the SolveApp through the two accessors given here). If upstream renames Shell or its `app` field (the
# SolveApp), follow it here.
- live: true
  file: apps/*-web/src/main.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'crate::live::runner()'
- live: true
  file: apps/*-web/src/main.rs
  find: 'Ok\(Box::new\((?=\s*Shell\s*\{)'
  replace: 'Ok(crate::live::wrap(|shell: &Shell| &shell.app, |shell: &mut Shell| &mut shell.app, '
# serde_json for the web crate's native tests (it has it on wasm), under a target spelling nobody else uses.
- live: true
  file: apps/*-web/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(not(target_arch = \"wasm32\")))'.dev-dependencies]\nserde_json = { workspace = true }\n"
# Undo and Redo of the session's designs go to the session, which takes back only this person's edits: first in
# SolveApp::run, which every Undo goes through (the app bar, Ctrl+Z/Y, menus, the control channel). The web app sets
# the hook (and the start page's, below). Verify: the e2e's undo step reverts only the owner's edit.
- live: true
  file: crates/ui-egui/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: Undo and Redo, while the web app's session takes them.\n#[cfg(target_arch = \"wasm32\")]\npub static LIVE_UNDO: std::sync::OnceLock<fn(&str) -> bool> = std::sync::OnceLock::new();\n/// The start page's list of the session's designs, while the web app's session shows one.\n#[cfg(target_arch = \"wasm32\")]\npub static LIVE_HOME: std::sync::OnceLock<fn(&mut SolveApp, &mut egui::Ui)> = std::sync::OnceLock::new();\n"
- live: true
  file: crates/ui-egui/src/lib.rs
  find: 'pub\s+fn\s+run\s*\(\s*&mut\s+self\s*,\s*id\s*:\s*&str\b[^{]*\{'
  after: "\n        #[cfg(target_arch = \"wasm32\")] if crate::LIVE_UNDO.get().is_some_and(|undo| undo(id)) { return Ok(Default::default()); }"
# The open designs for the session (every tab's design, a tab opened behind the others): a child module of documents,
# which keeps its tabs private. Verify: `cargo test -p solidcraft-web live::` (a design opened in a session reaches
# the others behind their own). If upstream renames DocSlot's `session`/`pre_sketch_marker` or Documents' `slots`,
# follow it in documents_live.rs.
- live: true
  file: crates/ui-egui/src/documents.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: the open designs, for the web app.\n#[path = \"documents_live.rs\"]\npub mod live;\n"
# The start page lists the session's designs ("In this session", one row each, a click shows it or opens it again
# where it was closed) above Recent. Verify: in a session, close a shared design's tab, open Home: its row says
# "Closed here" and a click opens it again. If upstream moves Recent, anchor on the start page's next section.
- live: true
  file: crates/ui-egui/src/home.rs
  find: '^[ \t]*(?:FileView::)?section\(\s*ui\s*,[^\n]*[Rr]ecent'
  before: "#[cfg(target_arch = \"wasm32\")] if let Some(list) = crate::LIVE_HOME.get() { list(app, ui); }\n"
