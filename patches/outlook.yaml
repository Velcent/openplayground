# Rule 1: follow the browser's light or dark preference until a theme is picked.
# What it's for: MailCraft's Theme setting (File > Options > General) defaulted to Light, so the app stayed light
#   on a dark system, unlike the other apps here.
# How: the setting's default is "system", its "Use system setting" choice. The app then follows egui's system
#   theme, which eframe reads from the browser's prefers-color-scheme. A theme picked in Options stays as before.
# Verify: open /outlook/ in a fresh browser profile with the system in dark mode: the mailbox is dark. With the
#   system in light mode it is light.
# If upstream changes: delete this rule once the default is "system". If the line moved, re-anchor on the
#   general.theme setting's Choice.
- file: crates/engine/src/settings.rs
  find: '("general\.theme", "Theme:", Choice\()"light"'
  replace: '$1"system"'
