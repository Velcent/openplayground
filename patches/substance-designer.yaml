# MaterialCraft in the browser. Upstream ships desktop builds only; these patches add the web build Playground serves.
#
# patches/substance-designer/web.diff adds new files only:
#   apps/materialcraft-web/   the web crate build.mjs finds (Cargo.toml, Trunk.toml, index.html, src/main.rs). It
#                             depends on the library with the `gui` feature and calls materialcraft::gui::web::start().
#   src/playground.rs         web shims for the library: an in-memory `std::fs`, a `std::thread` that runs scoped
#                             threads one after another and queues spawned jobs, web-time's clock, `std::env::temp_dir`,
#                             `craft_atomic::atomic_write` into the in-memory files, and the 3D viewport's shaders as
#                             GLSL ES (WebGL2).
#   src/playground_gui.rs     the editor's browser side: rfd's blocking dialogs answered by Playground's
#                             `globalThis.playgroundFiles` (Open/Save As/Publish through the file explorer, browser
#                             storage and downloads; exports and bakes download), in-memory preferences instead of
#                             craft-settings' folder, the queued jobs run between frames, and the WebRunner.
# The editor (src/gui.rs, with gui_home/gui_params/gui_ui include!d into it) is a binary upstream. On wasm the rules
# below also build it as a library module (`materialcraft::gui`), so the web crate (and `build.mjs check`) compiles it,
# with every dependency spec taken from upstream's own Cargo.toml.
# The modules that use threads, files or the clock take `std` from src/playground.rs on wasm through ONE `use` line
# at their end (a local `std` shadows the standard library's name in that module; everything else in it still comes
# from the real std). Native builds see none of this: every rule adds wasm-only lines or wasm-only cfg conditions.
# If upstream starts using std::thread/std::fs/Instant in another module, give that module the same one-line rule.

# Rule 1/13: the web dependencies of src/playground*.rs (all already in Cargo.lock through eframe).
# Verify: build.mjs check. If upstream adds them itself, drop the duplicates here.
- file: Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nweb-time = \"1\"\nwasm-bindgen = \"0.2\"\nwasm-bindgen-futures = \"0.4\"\njs-sys = \"0.3\"\nweb-sys = { version = \"0.3\", features = [\"Window\", \"Document\", \"Element\", \"HtmlCanvasElement\", \"console\"] }\n"

# Rule 2/13: the shims, and the editor as a library module on wasm (`extern crate self` lets its
# `use materialcraft::…` lines resolve inside the library).
# If upstream turns the editor into a library itself, point apps/materialcraft-web at that instead.
- file: src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build (patches/substance-designer.yaml): web shims, and the editor as a module for apps/materialcraft-web.\n#[cfg(target_arch = \"wasm32\")] #[doc(hidden)] pub mod playground;\n#[cfg(all(target_arch = \"wasm32\", feature = \"gui\"))] extern crate self as materialcraft;\n#[cfg(all(target_arch = \"wasm32\", feature = \"gui\"))] #[path = \"gui.rs\"] pub mod gui;\n"

# Rule 3/13: the editor's browser side (src/playground_gui.rs), and its `std`, `rfd` and `craft_settings` names
# pointing at the shims (for gui.rs and the files it include!s).
- file: src/gui.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build (patches/substance-designer.yaml): files, dialogs, threads and settings in the browser.\n#[cfg(target_arch = \"wasm32\")] #[path = \"playground_gui.rs\"] pub mod web;\n#[cfg(target_arch = \"wasm32\")] use {crate::playground::std, web::{craft_settings, rfd}};\n"

# Rule 4/13: the desktop entry point (NativeOptions, run_native) stays out of the web build.
# If upstream changes: anchor on wherever the editor's `fn main` lives.
- file: src/gui*.rs
  find: '^fn\s+main\s*\('
  before: "#[cfg(not(target_arch = \"wasm32\"))]\n"

# Rules 5-6/13: GPU compute (wgpu with Vulkan/DX12/Metal) is off in the browser: the CPU path upstream uses without
# the `gpu` feature. Verify: the status bar says "Engine: CPU". If upstream's switch changes, keep `imp` CPU on wasm.
- file: src/gpu.rs
  find: '#\[cfg\(not\(feature\s*=\s*"gpu"\)\)\](?=\s*mod\s+imp\b)'
  replace: '#[cfg(any(not(feature = "gpu"), target_arch = "wasm32"))]'
- file: src/gpu.rs
  find: '#\[cfg\(feature\s*=\s*"gpu"\)\](?=\s*mod\s+imp\b)'
  replace: '#[cfg(all(feature = "gpu", not(target_arch = "wasm32")))]'

# Rule 7: the 3D viewport shares the compute engine's wgpu device (viewer hooks over the `imp` that is CPU on wasm),
# so they follow `imp`'s condition. Verify: build.mjs check. If upstream cfg-gates them with imp, drop this.
- file: src/gpu.rs
  find: '#\[cfg\(feature\s*=\s*"gpu"\)\](?=\s*impl\s+GTex\b)'
  replace: '#[cfg(all(feature = "gpu", not(target_arch = "wasm32")))]'
- file: src/gpu.rs
  find: '#\[cfg\(feature\s*=\s*"gpu"\)\](?=\s*pub\s+fn\s+viewer_parts\b)'
  replace: '#[cfg(all(feature = "gpu", not(target_arch = "wasm32")))]'
- file: src/gpu.rs
  find: '#\[cfg\(feature\s*=\s*"gpu"\)\](?=\s*pub\s+fn\s+viewer_limits\b)'
  replace: '#[cfg(all(feature = "gpu", not(target_arch = "wasm32")))]'
# ...and on wasm there is no engine: the viewer hooks report none, so the 3D view takes its CPU path.
- file: src/gpu.rs
  find: '(?![\s\S])'
  after: "\n#[cfg(all(feature = \"gpu\", target_arch = \"wasm32\"))]\nimpl GTex {\n    pub fn buffer(&self) -> &wgpu::Buffer { unreachable!() }\n    pub fn id(&self) -> usize { 0 }\n}\n#[cfg(all(feature = \"gpu\", target_arch = \"wasm32\"))]\npub fn viewer_parts() -> Option<(&'static wgpu::Device, &'static wgpu::Queue)> { None }\n#[cfg(all(feature = \"gpu\", target_arch = \"wasm32\"))]\npub fn viewer_limits() -> Option<wgpu::Limits> { None }\n"

# Rules 8-13/13: threads, files and the clock in the library's modules (see the top). sbs_native.rs reads the clock
# for new packages' ids (App::new makes one: without it the page panics at startup, "time not implemented").
- file: src/tex.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: threads, files and the clock (patches/substance-designer.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::std;\n"
- file: src/ops.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: threads, files and the clock (patches/substance-designer.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::std;\n"
- file: src/graph.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: threads, files and the clock (patches/substance-designer.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::std;\n"
- file: src/render3d.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: threads, files and the clock (patches/substance-designer.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::std;\n"
- file: src/sbs_native.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: threads, files and the clock (patches/substance-designer.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::std;\n"
- file: src/safeio.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: saves go to the in-memory files (patches/substance-designer.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::playground::craft_atomic;\n"

# Live editing in Playground sessions (patches/substance-designer/live.diff + the playground-live crate, tools.yaml
#   `live_kit`)
# What it's for: people in a Playground session edit one package's node graphs together and see where the others
#   point, what they select and what they drag (nodes, wires, boxes, sliders, the add-node menu), in their colour.
# How: the adapter lives in new files next to the editor: src/gui_live.rs (the shared document and its merge, the
#   frame hook, the guards below and the web wrapper) and src/gui_live/peers.rs (presence: this person's, and the
#   others' marks over the graph: pointers, name and value tags, ghosts, outlines and easing the kit's, wires, dashed
#   boxes and passthrough dots MaterialCraft's own). The playground-live crate (patches/live/kit, copied to the
#   checkout's playground-live/) is the session and the presence look. These rules only declare the module and call
#   in, each one line after a function's signature or at the end of a file, and add the crate as a dependency.
# Verify: node scripts/build.mjs check substance-designer head (and LIVE=0), the e2e (tests/live-apps/substance-designer.mjs)
#   and `cargo test --features gui --bin materialcraft-gui gui_live`.
# If upstream changes: if a function named below is renamed, anchor on its new signature; if App renames the fields
#   gui_live.rs uses (g, parents, sel, active, pan, zoom, pkgs, pkg_active, screen, connecting, rubber, search...),
#   follow them there.
#
# The adapter's dependencies, for the web and for native tests, under target spellings nobody else uses: the
# playground-live crate with its presence look (`egui`), and serde_json for the shared document (wasm-bindgen comes
# with rule 1).
- live: true
  file: Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(any(target_arch = \"wasm32\"))'.dependencies]\nplayground-live = { path = \"playground-live\", features = [\"egui\"] }\nserde_json = \"1\"\n\n[target.'cfg(any(not(target_arch = \"wasm32\")))'.dev-dependencies]\nplayground-live = { path = \"playground-live\", features = [\"egui\"] }\nserde_json = \"1\"\n"
# The adapter module, a child of the editor's root (gui.rs, which includes the other gui_*.rs) so it reaches App.
- live: true
  file: src/gui.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only, and its native tests).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod gui_live;\n"
# App::undo and App::redo: in a session they go to the session.
- live: true
  file: src/gui.rs
  find: '\bfn\s+undo\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if gui_live::undo(false) { return; }"
- live: true
  file: src/gui.rs
  find: '\bfn\s+redo\s*\(\s*&mut\s+self\s*\)\s*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if gui_live::undo(true) { return; }"
# The workspace's packages: in a session the editor stays on the shared one (switching, adding or closing it waits).
- live: true
  file: src/gui.rs
  find: '\bfn\s+switch_pkg\s*\(\s*&mut\s+self\s*,\s*(\w+)\s*:\s*usize\s*\)\s*\{'
  replace: "$&\n        #[cfg(any(target_arch = \"wasm32\", test))] if gui_live::hold_switch(self, $1) { return; }"
- live: true
  file: src/gui.rs
  find: '\bfn\s+add_pkg_active\s*\(\s*&mut\s+self\b[^{]*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if gui_live::hold_add(self) { return; }"
- live: true
  file: src/gui.rs
  find: '\bfn\s+close_pkg\s*\(\s*&mut\s+self\s*,\s*(\w+)\s*:\s*usize\s*\)\s*\{'
  replace: "$&\n        #[cfg(any(target_arch = \"wasm32\", test))] if gui_live::hold_close(self, $1) { return; }"
# The Edit menu's and the toolbar's Undo/Redo stay enabled in a session.
- live: true
  file: src/gui_home.rs
  find: '\blet\s*\(\s*can_undo\s*,\s*can_redo\b[^;]*;'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] let (can_undo, can_redo) = (can_undo || gui_live::connected(), can_redo || gui_live::connected());"
# The web entry (src/playground_gui.rs, from web.diff): it keeps its runner for the adapter, and eframe runs the page's
# app wrapped (gui_live::web::Shell: the app's frame, then the session's). If that file changes: the runner is the
# one `start` creates, and `wrap` takes the app `start` hands to eframe plus how to reach the editor (App) in it.
- live: true
  file: src/playground_gui.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'super::gui_live::web::runner()'
- live: true
  file: src/playground_gui.rs
  find: 'Ok\(Box::new\(Web\((\w+)\)\)\)'
  replace: 'Ok(super::gui_live::web::wrap(Web($1), |web: &mut Web| &mut web.0))'
