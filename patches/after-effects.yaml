# Render viewer frames on the page's own GPU when it draws with WebGPU, instead of in frame workers: each
# worker renders on its own device and sends every frame back through a GPU readback, which made scrubbing
# lag. `?frameworkers=N` still picks a number of workers, and without WebGPU (frames rendered on the CPU)
# the upstream default stays, so the page keeps responding while frames render.
- file: apps/*-web/src/**/*.rs
  find: '(query_value\("frameworkers"\)[^;]*?\.unwrap_or\()\s*(\d+)\s*(?:usize)?\s*\)'
  replace: '$1if cc.wgpu_render_state.as_ref().is_some_and(|rs| rs.adapter.get_info().backend == eframe::wgpu::Backend::BrowserWebGpu) { 0usize } else { $2usize })'

# Live editing in Playground sessions (patches/after-effects/live.diff + the playground-live crate, tools.yaml `live_kit`)
# The adapter lives in new files: crates/engine/src/playground.rs (the shared project's binding, Undo/Redo/History
# hand-off), crates/ui-egui/src/playground.rs (the shared document, merge checks, media, presence, the kept runner and
# the web wrapper that ends each frame) and crates/ui-egui/src/panels/viewer_playground.rs (the viewer's Pen path and
# rubber band, for presence). The playground-live crate (patches/live/kit) gives the session and the presence look
# (pointers, name tags, playhead flags, ghosts, outlines, easing). These rules only declare them and call in, at
# signatures, long-standing mod lines, Cargo.toml's [dependencies], file ends and the Timeline's CTI. Verify: node
# scripts/build.mjs check after-effects head|release (and LIVE=0), then the e2e (tests/live-apps/after-effects.mjs) and
# `cargo test -p effectcraft-ui-egui --lib playground::`.
#
# A session (`?pg-session=<room>`) opens in a browser store of its own, so this person's last session, auto-saves,
# settings and media stay as they were: the OPFS folder and the IndexedDB database get `-session-<room>`. If upstream
# renames DIR/DB, anchor on the declarations of the storage names that storeOpen uses.
- live: true
  file: apps/effectcraft-web/js/host.js
  find: '^const\s+DIR\s*=\s*[^;\n]+'
  after: ' + (new URLSearchParams(self.location?.search).get("pg-session")?.replace(/[^0-9a-f-]/gi, "").replace(/^(?=.)/, "-session-") ?? "")'
- live: true
  file: apps/effectcraft-web/js/host.js
  find: '^const\s+DB\s*=\s*[^;\n]+'
  after: ' + (new URLSearchParams(self.location?.search).get("pg-session")?.replace(/[^0-9a-f-]/gi, "").replace(/^(?=.)/, "-session-") ?? "")'
# The web entry keeps its runner for the adapter and wraps its app, so each frame ends with the adapter's frame hook
# and the first one offers the adapter to the page. If upstream renames WebApp or its `app` field, follow it here.
- live: true
  file: apps/effectcraft-web/src/app.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'effectcraft_ui_egui::playground::runner()'
- live: true
  file: apps/effectcraft-web/src/app.rs
  find: 'Ok\(Box::new\((?=\s*WebApp\b)'
  replace: 'Ok(effectcraft_ui_egui::playground::boxed(|w: &mut WebApp| &mut w.app, '
# The engine's module (wasm, and native debug builds so native tests reach it; they never connect), declared next to a
# long-standing module, and Session::execute's first step: Undo, Redo and History jumps go to the session.
- live: true
  file: crates/engine/src/lib.rs
  find: '^pub\s+mod\s+commands;'
  after: "\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))] pub mod playground;"
- live: true
  file: crates/engine/src/lib.rs
  find: 'pub\s+fn\s+execute\s*\([^{]*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", debug_assertions))] if let Some(r) = self.live_execute(id, &params) { return r; }"
# The playground-live crate (patches/live/kit, copied to the checkout's playground-live/): a dependency of the engine
# (the session's Undo), and of the frontend with its presence look (`egui`).
- live: true
  file: crates/engine/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\" }\n"
- live: true
  file: crates/ui-egui/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
# The frontend's module (wasm, and native debug builds for its tests).
- live: true
  file: crates/ui-egui/src/lib.rs
  find: '^pub\s+mod\s+icons;'
  after: "\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))] pub mod playground;"
# The comp viewer's first step records that it is on screen (its layer and clip): the end-of-frame hook then reads this
# person's pointer in comp pixels and draws the others' pointers, names and selected layers' outlines over it.
- live: true
  file: crates/ui-egui/src/panels/viewer.rs
  find: 'pub\s+fn\s+show\s*\([^{]*\{'
  after: "\n    #[cfg(any(target_arch = \"wasm32\", debug_assertions))] crate::playground::viewer(ui);"
# The viewer's child module (it reads the Pen's path and a shape drag, which the viewer keeps private, so the others
# see them as they are drawn), declared at the end of the file. If upstream renames Gesture::Create, shape_drag or
# pen_id, follow them in viewer_playground.rs.
- live: true
  file: crates/ui-egui/src/panels/viewer.rs
  find: '(?![\s\S])'
  after: "\n#[cfg(any(target_arch = \"wasm32\", debug_assertions))] #[path = \"viewer_playground.rs\"] pub(crate) mod playground;\n"
# The Timeline, right before it draws this person's CTI: the others' dragged keyframes and scrubbed current times (a
# line with a name flag on the ruler), where its rows and ruler are this frame (their automation ids), so this
# person's CTI stays on top. If the CTI's `let cx = tm.x(time.seconds());` changes, call it anywhere in
# timeline::show after the rows are drawn and before the CTI.
- live: true
  file: crates/ui-egui/src/panels/timeline.rs
  find: '^\s*let\s+cx\s*=\s*tm\.x\(time\.seconds\(\)\)\s*;'
  before: "    #[cfg(any(target_arch = \"wasm32\", debug_assertions))] crate::playground::timeline(app, ui);\n"
# Every press's hit test in the viewer (layers_at: Selection, Rotate, Pan Behind, drops, Puppet, Object Matte) takes
# the frontend's selectable_layers, which leaves out a layer someone else's Pen is still drawing a path in (the
# document has it from their first click, on top; a one-vertex path's box is a point, which point_in_quad finds every
# press inside, and later the box spans the path so far). A `use` in the function shadows the viewer's own
# selectable_layers there. If layers_at stops calling selectable_layers, put the `use` in whatever
# function now lists the layers a press can hit.
- live: true
  file: crates/ui-egui/src/panels/viewer.rs
  find: '(?:pub(?:\([^)]*\))?\s+)?fn\s+layers_at\b[^{]*\{'
  after: "\n    #[cfg(any(target_arch = \"wasm32\", debug_assertions))] use crate::playground::selectable_layers;"
