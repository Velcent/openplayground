# PdfCraft: no rule patches outside live editing; its diffs (patches/acrobat/) and the playground-live crate (tools.yaml
#   `live_kit`) apply.
#
# Live editing in Playground sessions (patches/acrobat/live.diff + the playground-live crate, tools.yaml `live_kit`)
# What it's for: people in a Playground session edit the session's PDFs together (each one the file plus its changed
#   objects, merged per object and dictionary key; every PDF opened in the session reaches the others as a tab behind
#   theirs, closing a tab is personal) and see each other's pointer, selected comment and the gesture under way (comments
#   being drawn, moved or resized, text being selected or typed) on the pages they look at, with dots on the tabs for
#   who is where.
# How: the adapter lives in new files: crates/ui-egui/live/live.rs (the shared PDFs, merge, adopt, Undo, presence and
#   its drawing: pointers, tags, ghosts, outlines and easing the kit's, a drawing's strokes and bands PdfCraft's own;
#   tab dots, Home's "In this session", the kept web runner and the app wrapper whose frames end with the session's
#   frame hook) and crates/engine/src/live_playground.rs (installs a shared graph with no undo step, forgets history,
#   and saves of a shared PDF keep its graph). These rules only declare them and call in, each one line at the end of a
#   file, right after a function's signature or one statement, or at the web runner, and add the crate as a dependency.
# Verify: node scripts/build.mjs check acrobat head|release (and LIVE=0), the e2e (tests/live-apps/acrobat.mjs) and
#   `cargo test -p pdfcraft-ui-egui --lib live::` with these rules and live.diff applied.
# If upstream changes: if a function named below is renamed, anchor on its new signature (keep the argument names
#   the inserted line uses, or rename them there); if the web entry stops returning `Ok(Box::new(app))`, wrap the app
#   it returns with `pdfcraft_ui_egui::live::wrap`.
#
# The engine's live module (web, and the native tests), a child of the crate root so it reaches the editing state.
- live: true
  file: crates/engine/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only).\npub mod live_playground;\n"
# Session::mark_saved: a save of the shared PDF keeps the shared graph (its /ModDate is not everyone's change).
#   (Session lives in lib.rs or in session.rs, by version; the glob finds either.)
- live: true
  file: crates/engine/src/*.rs
  find: 'pub\s+fn\s+mark_saved\s*\([^{]*\{'
  after: "\n        if crate::live_playground::keeps_graph(id) { return self.live_mark_saved(id); }"
# Session::show_released, which live_playground (a child of the crate root) calls after a failed refresh.
- live: true
  file: crates/engine/src/*.rs
  find: '(?<!pub\(crate\) )\bfn\s+show_released\b'
  replace: 'pub(crate) fn show_released'
# The app's live module (web, and the native tests), outside src/, and the playground-live crate (patches/live/kit:
#   the session and the presence look, `egui`) it uses.
- live: true
  file: crates/ui-egui/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only).\n#[cfg(any(target_arch = \"wasm32\", test))]\n#[path = \"../live/live.rs\"]\npub mod live;\n"
- live: true
  file: crates/ui-egui/Cargo.toml
  find: '^\[dependencies\]\n'
  after: "playground-live = { path = \"../../playground-live\", features = [\"egui\"] }\n"
# Undo and Redo of the shared PDF go to the session.
- live: true
  file: crates/ui-egui/src/editing.rs
  find: 'fn\s+history_step\s*\([^{]*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if crate::live::undo(self, undo) { return; }"
# Undo and Redo stay available for the shared PDF (the session's), Revert is off (it would take back everyone's edits).
- live: true
  file: crates/ui-egui/src/commands.rs
  find: 'fn\s+command_enabled\s*\(\s*&self[^{]*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if let Some(on) = crate::live::command_enabled(self, spec.id) { return on; }"
# The others' pointers and selected comments, drawn after the pages (the find bar comes next, over them).
- live: true
  file: crates/ui-egui/src/canvas.rs
  find: 'fn\s+find_bar\s*\([^{]*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] crate::live::paint(view, area, ui);"
# The web entry: the runner the session keeps, and the app wrapped so each frame ends with the session's frame hook.
- live: true
  file: apps/pdfcraft-web/src/main.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'pdfcraft_ui_egui::live::runner()'
- live: true
  file: apps/pdfcraft-web/src/main.rs
  find: 'Ok\(\s*Box::new\((?=\s*app\s*\)\s*\))'
  replace: 'Ok(pdfcraft_ui_egui::live::wrap('
# Shared tabs: each tab of a PDF of the session shows dots in the colours of the others on it (in chrome::tab_strip,
#   right after the statement that draws a document tab, the first `let response = tab(ui, …);`), and Home lists the
#   session's PDFs ("In this session", above Recent) to go to or open again. Verify: the e2e's openTab step and the
#   screenshots. If the document tab is drawn otherwise, call tab_dots(app, ui, i, rect) right after it with its index
#   and rect; if Home's Recent section moves, call session_list(app, ui) before it.
- live: true
  file: crates/ui-egui/src/chrome.rs
  find: 'let\s+response\s*=\s*tab\(\s*ui\b[^;]*;'
  after: "\n                                #[cfg(target_arch = \"wasm32\")] crate::live::tab_dots(app, ui, i, response.rect);"
- live: true
  file: crates/ui-egui/src/home.rs
  find: 'let\s+mut\s+clear\s*=\s*false\s*;'
  before: "#[cfg(target_arch = \"wasm32\")] crate::live::session_list(app, ui);\n            "
