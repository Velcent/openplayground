#   with its path, so it stays bound to that file.
# Verify: save a document to browser storage, then within the same session (the Recent list isn't kept
#   across reloads on the web) File → Open: it's under Recent; clicking it opens it.
# If upstream changes: anchor on the Recent list's click handler. The anchor is the `file.open {path}` call
#   itself, in either spelling: the click handler's `let _ = app.run(…);` (releases) or open_recent's
