  find: 'pub\s+fn\s+run\s*\(\s*&mut\s+self\s*,\s*(\w+)\s*:\s*&str\s*,\s*(\w+)\s*:[^{]*\{'
  replace: "$&\n        if crate::LIVE_UNDO.get().is_some_and(|undo| undo(self.document_id(), $1, &$2)) { return Ok(Default::default()); }"
# qat_enabled, the Quick Access Toolbar's (and its keytips') enabled state: Undo and Redo while the session holds them.
- live: true
  file: crates/ui-egui/src/**/*.rs
  find: 'fn\s+qat_enabled\s*\(\s*(\w+)\s*:\s*&WordApp\s*,\s*(\w+)\s*:\s*&str\s*\)\s*->\s*bool\s*\{'
