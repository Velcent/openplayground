- live: true
  file: apps/wordcraft-web/src/web.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'live::runner()'
- live: true
  file: apps/wordcraft-web/src/web.rs
  find: 'Ok\(Box::new\((?=\s*WebShell\b)'
  replace: 'Ok(live::wrap('
# The canvas's drags under way, read for the others where they are kept (each module a child, so it reaches its drag's
# private fields): an object's frame (objects.rs), an ink stroke (ink.rs), a table border (table_resize.rs).
- live: true
  file: crates/ui-egui/src/objects.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: what a drag here is doing, for the others (objects/live.rs).\npub mod live;\n"
- live: true
  file: crates/ui-egui/src/ink.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: what a drag here is doing, for the others (ink/live.rs).\npub mod live;\n"
- live: true
  file: crates/ui-egui/src/table_resize.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session: what a drag here is doing, for the others (table_resize/live.rs).\npub mod live;\n"
