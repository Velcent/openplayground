# LightCraft Classic is a fork of LightCraft (patches/lightroom.yaml has the same three fixes for it); its crates
# are named dac_* and its web app is apps/web.

# Rule 1: keep the page responsive while the app prepares the photos next to the one on screen.
# What it's for: once a photo is in Loupe or Develop, the app prefetches its filmstrip neighbours
#   (Renderer::prefetch). Every other render goes to the browser build's render workers, but prefetch always
#   used the local job pool, which in the browser runs one job per frame on the page's only thread
#   (Renderer::poll → JobPool::run_inline). Preparing a photo there froze the whole page, top bar included,
#   for seconds; a large raw file freezes it longer. The decoded source also stayed in the page's own cache,
#   which the workers never read.
# How: when the renderer has an offload (the workers), a prefetch is queued and dispatched to a worker exactly
#   like Renderer::request does; the worker keeps the decoded source and the photo's next render goes back to
#   it (the workers' affinity). Without workers (desktop, or none started) nothing changes.
# Verify: open /lightroom-classic/ and step through the sample photos in Loupe: a 20 ms setInterval never
#   stalls for more than about a second, and the next photo still shows at once.
# If upstream changes: delete this rule once Renderer::prefetch (crates/ui-egui/src/render.rs) hands its job to
#   `self.offload` itself (or no longer calls `self.pool.submit`). If only the line moved, re-anchor on the
#   prefetch's pool submit.
- file: crates/ui-egui/src/render.rs
  find: 'self\.pool\.submit\(slot, key, priority, Box::new\(move \|\| \w+::memory::in_background\(\|\| job\.run\(\)\)\)\);'
  replace: |-
    if self.offload.is_some() {
                self.seq += 1;
                self.queue.retain(|q| q.slot != slot);
                self.queue.push(Queued { slot, priority, seq: self.seq, job });
                self.dispatch();
                return;
            }
            $&

# Rule 2: drop the notice the app shows on every launch.
# What it's for: for 8 s after opening, "LightCraft Classic in the browser is experimental. Your library is kept
#   in this browser's storage: …" covered the photo, with a box for the ▸ its font can't draw. The warning that
#   matters stays: the one rule 3 fixes, shown only when the browser hasn't granted persistent storage, so it
#   may really delete the library.
# How: the `if backend.is_some() { notice(…) }` in WebApp::new goes.
# Verify: open /lightroom-classic/: no notice at the bottom of the photo on a browser that grants persistent
#   storage.
# If upstream changes: delete this rule once that notice is gone or no longer shown on every launch; if only its
#   wording changed, re-anchor on the new text.
- file: apps/web/src/web.rs
  find: '\n[ \t]*if backend\.is_some\(\) \{\s*notice\([^;]*in the browser is experimental\.[^;]*;\s*\}'
  replace: ''

# Rule 3: write the menu path in the storage warning with characters the app's font has.
# What it's for: "use File ▸ Back Up Library… now and then." showed a box for ▸.
# How: "File > Back Up Library".
# Verify: in a browser that doesn't grant persistent storage (a fresh headless Chromium profile), the notice at
#   the bottom of the photo reads "use File > Back Up Library now and then." with no box.
# If upstream changes: delete this rule once the notice no longer has the ▸, or its font draws it.
- file: apps/web/src/web.rs
  find: 'File ▸ Back Up Library… now and then'
  replace: 'File > Back Up Library now and then'

# Rule 4: Library > Previews > Build / Discard Previews without the "time not implemented" crash.
# What it's for: both run discard_full (crates/engine/src/cmd/previews.rs), which read std's SystemTime::now()
#   first thing. In the browser build that panics ("time not implemented on this platform") and the app stops.
# How: `now` is the Unix epoch instead. It only ages 1:1 previews kept on disk, which the browser build has
#   none of; with the epoch no preview counts as old, so the age-based discard keeps them all.
# Verify: open /lightroom-classic/, Library > Previews > Build Standard-Sized Previews (Visible): no crash.
# If upstream changes: delete this rule once discard_full no longer calls std's SystemTime::now() on wasm32.
- file: crates/engine/src/cmd/previews.rs
  find: 'let now = std::time::SystemTime::now\(\);(\s*let mut d = Discarded::default\(\);)'
  replace: 'let now = std::time::UNIX_EPOCH;$1'

# Rule 5: dropping a session no longer crashes the browser build.
# What it's for: Downloads::drop (crates/engine/src/face_download.rs, part of every Session) waited up to 1 s
#   for running model downloads, timed with std's Instant::now(), which panics in the browser build ("time not
#   implemented on this platform"). The web app drops a Session whenever opening the stored library fails (it
#   swaps in an empty one to show the problem), so that failure stopped the app on every load instead.
# How: the wait is compiled for native builds only; the browser build has no download threads to wait for.
# Verify: rule 6's storage being unreadable (or any library that fails to open) shows the library-problem
#   window instead of "stopped after an internal error: time not implemented on this platform".
# If upstream changes: delete this rule once Downloads::drop no longer reads std's clock on wasm32.
- file: crates/engine/src/face_download.rs
  find: 'let started = std::time::Instant::now\(\);\s*while self\.running\(\) && started\.elapsed\(\) < Duration::from_secs\(1\) \{\s*std::thread::sleep\(Duration::from_millis\(10\)\);\s*\}'
  replace: |-
    #[cfg(not(target_arch = "wasm32"))]
            {
                $&
            }

# Rule 6: keep LightCraft Classic's browser storage apart from LightCraft's.
# What it's for: both apps are served from this one site, so they share its browser storage, and the fork kept
#   LightCraft's names for all of it: the library, thumbnails and active-library pointer at the OPFS root, the
#   IndexedDB database "lightcraft" and the tab lock "lightcraft-library". Anyone who had used Lightroom
#   (LightCraft) here got LightCraft's library handed to Classic, which can't open it (rule 5's crash).
# How: in OPFS the backend works inside a "lightcraft-classic" folder (created on first use) instead of the root;
#   the IndexedDB fallback and the tab lock get "lightcraft-classic" names. Render workers open storage the same
#   way, so they follow.
# Verify: use /lightroom/ first, then open /lightroom-classic/: the sample library opens, and /lightroom/ still
#   has its own photos afterwards. In DevTools > Application > Storage, OPFS has a lightcraft-classic folder.
# If upstream changes: re-anchor on Backend::open's OPFS root and on legacy.rs's IDB_NAME / TAB_LOCK.
- file: apps/web/src/backend.rs
  find: 'Ok\(root\) => return Ok\(Backend::Opfs\(root\.unchecked_into\(\)\)\),'
  replace: |-
    Ok(root) => {
                        // playground (patches/lightroom-classic.yaml rule 6): our own folder, apart from LightCraft's.
                        let root: FileSystemDirectoryHandle = root.unchecked_into();
                        let opts = FileSystemGetDirectoryOptions::new();
                        opts.set_create(true);
                        match JsFuture::from(root.get_directory_handle_with_options("lightcraft-classic", &opts)).await {
                            Ok(dir) => return Ok(Backend::Opfs(dir.unchecked_into())),
                            Err(e) => log::warn!("OPFS folder unavailable ({}); using IndexedDB", err(e)),
                        }
                    }
- file: apps/web/src/legacy.rs
  find: 'pub const IDB_NAME: &str = "lightcraft";'
  replace: 'pub const IDB_NAME: &str = "lightcraft-classic";'
- file: apps/web/src/legacy.rs
  find: 'pub const TAB_LOCK: &str = "lightcraft-library";'
  replace: 'pub const TAB_LOCK: &str = "lightcraft-classic-library";'
