# from crates/earthcraft-playground on wasm (see the top). Found with: every non-test module that names Instant,
# SystemTime, fs::, File::, OpenOptions, thread::, env:: or process::id, except those whose code doesn't run on the web
# (the workers and stand-ins below, mbtiles.rs, profiling.rs), updater.rs (its env:: calls don't panic) and fonts.rs
# (its thread then fails to start, see the top). tiles/cache.rs takes Moka's stand-in from it too; app/mod.rs declares
# the page. If upstream starts using these in another module, give it the same line; a missing one panics at the first
