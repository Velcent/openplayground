# EarthCraft in the browser. Upstream (github.com/therichronicles/EarthCraft) has no browser build (no wasm32 code at
# all) and releases desktop packages only; these patches add the web build Playground serves, from its head commit.
#
# patches/google-earth/web.diff adds new files only:
#   index.html, Trunk.toml     the web build at the repository's root (build.mjs builds there): trunk builds
#                              apps/earthcraft's `earthcraft` binary for the page's canvas.
#   apps/earthcraft/src/app/web.rs   the page's side: `main` runs as on the desktop, and the crate root takes `eframe`
#                              (and `self_update`) from here, whose `run_native` starts the app on the canvas; Open KML…,
#                              Save As…, and the Explorer's planet and image pickers are Playground's dialogs (`rfd`);
#                              "Open in EarthCraft" opens a KML/KMZ (or a planet), as a file dropped on the globe does;
#                              what EarthCraft writes outside its own folders (a saved KML or planet, a screenshot in
#                              /EarthCraft) goes to Files after the frame, and a save to download is handed to the
#                              browser once written; links open in a new tab, as the desktop opens the browser.
#   apps/earthcraft/src/app/explorer/web.rs   where the Explorer's picker answers land.
#   crates/earthcraft-playground/   what wasm32-unknown-unknown lacks: `std` with web-time's clock, an in-memory file
#                              system and `path::absolute`, `HOME` (`/`: settings and caches in memory), `env::temp_dir`,
#                              `process::id`, and a `thread::spawn` that never runs its work (the settings writer's loop,
#                              which waits for work); and a stand-in for Moka's cache, which reads std's clock. The
#                              modules that use them take `std` from it on wasm through ONE `use` line at their end (a
#                              local `std` shadows the standard library's name in that module; everything else in it still
#                              comes from the real std).
#     tokio/, reqwest/         Tokio and reqwest as a page has them, which crates/earthcraft-data takes under their own
#                              names on wasm: tasks on the page's event loop, the browser's timers, the in-memory files;
#                              requests through the browser's fetch, with every future Send as the crate expects.
#   crates/earthcraft-render/src/{worker,overlays/worker,live_layers/worker,aircraft/worker}/web.rs   the frame
#                              coordinator and the overlay, live-layer and aircraft preparation without their threads:
#                              a submitted view is rasterized (or prepared) at once, on the page's one thread (Rayon runs
#                              there too), and published for the app's next frame, as each thread publishes it.
#   crates/earthcraft-data/src/boundaries/updates/web.rs   the boundary merge without its thread, when the app asks.
#   crates/earthcraft-data/src/tiles/disk/web.rs   no imagery disk cache (MBTiles through SQLite on a worker thread):
#                              the browser's HTTP cache keeps fetched tiles, and decoded ones stay in memory as on the
#                              desktop.
#   crates/earthcraft-data/src/updater/web.rs   no updates: Playground serves the newest build.
#
# The globe is upstream's default CPU ray-caster (glam/wide with wasm SIMD, on one thread), drawn as an egui texture;
# eframe draws through wgpu on WebGPU where the browser has it, else on WebGL2 (wgpu's `webgl` feature, added below).
# egui's own shaders run on both. Upstream's experimental GPU globe renderer (WGSL compute shaders, opt-in with
# EARTHCRAFT_RENDERER, which a page can't set) stays off: it waits on the GPU with pollster::block_on, which a page
# can't do, and WebGL2 has no compute shaders at all.
#
# Data sources, checked from a page on 2026-10-27 (CORS: whether a page on another site may read them):
#   on    Esri World Imagery and Wayback (and its release list), OpenStreetMap and OpenTopoMap tiles, Mapterhorn terrain,
#         Natural Earth borders and names (raw.githubusercontent.com), RainViewer radar, Matt Eason's cloud map,
#         OpenSeaFeed AIS ships (asked again without EarthCraft's Digitraffic-User header, whose preflight it refuses)
#         and Fintraffic's (Digitraffic) fallback, CelesTrak satellites, Nominatim search and Photon suggestions, Overpass
#         roads and worldwide municipal borders (overpass-api.de answers pages; both Overpass servers were often busy or
#         slow while testing), TomTom traffic (with the user's key, as on the desktop).
#   off   live aircraft: OpenSky answers only its own site and ADSB.lol sends no CORS header, so the layer's checkbox is
#         greyed out, saying why.
#   untested  IBGE's Brazilian municipal and metropolitan outlines (servicodados.ibge.gov.br didn't answer from here).
# Also off on the web: installed fonts (a page can't list them; Settings says the font worker can't start), choosing
# folders (Settings' Browse: the paths stay as typed), settings kept between visits (they live for the page), narrated
# tours' system speech, and updates. Native builds see none of this: every rule adds wasm-only lines, or moves a
# native-only dependency into a native-only table.

# Rules 1-16/81: the dependencies. Tokio (threads, sockets, files), reqwest, Moka, SQLite (the tile cache) and
# self_update have no browser side: a native-only table opens at the end of each manifest and each one's line moves into
# it, and rfd's non-Linux table leaves out wasm (a page's dialogs are Playground's). The wasm-only ones go under a target
# spelling nobody else uses (`all(...)`): the playground crates, wgpu's WebGL2 backend, sys-locale's browser language
# (the page follows the browser's English or Portuguese, as the desktop follows the system), wasm-bindgen for the page.
# crates/earthcraft-data then takes the playground's Tokio and reqwest under their own names (an `extern crate … as` at
# its root puts the name in every module's scope), and SQLite's two error kinds are native-only. If upstream drops or
# renames one of the moved dependencies, drop its rule.
- file: crates/earthcraft-data/Cargo.toml
  find: '(?![\s\S])'
  after: "\n# Playground's web build (patches/google-earth.yaml): what has no browser side.\n[target.'cfg(not(target_arch = \"wasm32\"))'.dependencies]\n"
- file: crates/earthcraft-data/Cargo.toml
  find: '^(tokio\.workspace\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2$1\n"
- file: crates/earthcraft-data/Cargo.toml
  find: '^(reqwest\.workspace\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2$1\n"
- file: crates/earthcraft-data/Cargo.toml
  find: '^(moka\.workspace\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2$1\n"
- file: crates/earthcraft-data/Cargo.toml
  find: '^(rusqlite\.workspace\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2$1\n"
- file: crates/earthcraft-data/Cargo.toml
  find: '^(tokio-rusqlite\.workspace\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2$1\n"
- file: crates/earthcraft-data/Cargo.toml
  find: '^(self_update\.workspace\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2$1\n"
- file: crates/earthcraft-data/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nearthcraft-playground = { path = \"../earthcraft-playground\" }\nearthcraft-playground-tokio = { path = \"../earthcraft-playground/tokio\" }\nearthcraft-playground-reqwest = { path = \"../earthcraft-playground/reqwest\" }\n"
- file: crates/earthcraft-core/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nearthcraft-playground = { path = \"../earthcraft-playground\" }\n"
- file: apps/earthcraft/Cargo.toml
  find: '(?![\s\S])'
  after: "\n# Playground's web build (patches/google-earth.yaml): what has no browser side.\n[target.'cfg(not(target_arch = \"wasm32\"))'.dependencies]\n"
- file: apps/earthcraft/Cargo.toml
  find: '^(self_update\.workspace\s*=[^\n]*)\n([\s\S]*)$'
  replace: "$2$1\n"
- file: apps/earthcraft/Cargo.toml
  find: "^\\[target\\.'cfg\\(not\\(any\\(target_os = \"linux\", target_os = \"freebsd\"\\)\\)\\)'\\.dependencies\\]"
  replace: "[target.'cfg(not(any(target_os = \"linux\", target_os = \"freebsd\", target_arch = \"wasm32\")))'.dependencies]"
- file: apps/earthcraft/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\nearthcraft-playground = { path = \"../../crates/earthcraft-playground\" }\nwgpu = { workspace = true, features = [\"webgl\"] }\nsys-locale = { workspace = true, features = [\"js\"] }\nwasm-bindgen = \"0.2\"\nwasm-bindgen-futures = \"0.4\"\njs-sys = \"0.3\"\nweb-sys = { version = \"0.3\", features = [\"Window\", \"Document\", \"Element\", \"HtmlCanvasElement\", \"console\"] }\n"
- file: crates/earthcraft-data/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: Tokio and reqwest as a page has them (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")] extern crate earthcraft_playground_tokio as tokio;\n#[cfg(target_arch = \"wasm32\")] extern crate earthcraft_playground_reqwest as reqwest;\n"
- file: crates/earthcraft-data/src/error.rs
  find: '^([ \t]*)(#\[error\(transparent\)\]\s*Sqlite\(#\[from\] rusqlite::Error\),)'
  replace: "$1#[cfg(not(target_arch = \"wasm32\"))]\n$1$2"
- file: crates/earthcraft-data/src/error.rs
  find: '^([ \t]*)(#\[error\(transparent\)\]\s*SqliteWorker\(#\[from\] tokio_rusqlite::Error\),)'
  replace: "$1#[cfg(not(target_arch = \"wasm32\"))]\n$1$2"

