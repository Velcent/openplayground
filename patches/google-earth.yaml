# Rules 67-70/81: what has no browser side, given a stand-in on wasm (see the top): the imagery disk cache (mbtiles.rs,
# SQLite) and the updater's release check (release.rs, self_update), each module swapped for its web.rs, with the
# updater's one match on a self_update error native-only; and the decoders' CPU pools (Rayon pools of their own, whose
# threads a page can't start), whose work runs in place. If upstream renames these, follow.
- file: crates/earthcraft-data/src/tiles/disk.rs
  find: '^mod mbtiles;'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\nmod mbtiles;\n// Playground's browser build: no disk cache (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")]\n#[path = \"disk/web.rs\"]\nmod mbtiles;"
- file: crates/earthcraft-data/src/updater.rs
  find: '^mod release;'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\nmod release;\n// Playground's browser build: no updates to install (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")]\n#[path = \"updater/web.rs\"]\nmod release;"
- file: crates/earthcraft-data/src/updater.rs
  find: 'Err\(error @ self_update::Error::InstallPathNotWritable'
  before: "#[cfg(not(target_arch = \"wasm32\"))] "
- file: crates/earthcraft-data/src/cpu.rs
  find: '\bpub\(crate\) async fn run<[^{]*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] return catch_panic(work);"

# Rules 71-79/81: the page (apps/earthcraft/src/app/web.rs, see the top). main.rs takes eframe and self_update from it,
# and presentation.rs eframe (for the desktop window's options, unused on the page); the modules with file dialogs take
# rfd from it, and the Explorer's answers land in explorer/web.rs, which tells it when the sky's row is drawn (both of
# its image pickers are alike). The aircraft checkbox (Layers, and the Explorer's) is greyed out on the web, saying why
# (see the top). If upstream adds a dialog elsewhere, give that module the rfd line; if it renames what these anchor
# on, follow.
- file: apps/earthcraft/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: run_native starts the app on the page (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")] use app::web::{eframe, self_update};\n"
- file: apps/earthcraft/src/presentation.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: the desktop window's options, unused on the page (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::app::web::eframe;\n"
- file: apps/earthcraft/src/app/files.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: Playground's dialogs (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")] use super::web::rfd;\n"
- file: apps/earthcraft/src/app/update_restart.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: Playground's dialogs (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")] use super::web::rfd;\n"
- file: apps/earthcraft/src/app/ui/settings/sections.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: Playground's dialogs (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")] use crate::app::web::rfd;\n"
- file: apps/earthcraft/src/app/explorer.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: Playground's dialogs, whose answers land in explorer/web.rs (patches/google-earth.yaml).\n#[cfg(target_arch = \"wasm32\")] use super::web::rfd;\n#[cfg(target_arch = \"wasm32\")] mod web;\n"
- file: apps/earthcraft/src/app/explorer.rs
  find: '^[ \t]*ui\.heading\(lg\.text\("explorer-sky-galaxy"\)\);'
  before: "#[cfg(target_arch = \"wasm32\")] super::web::sky_section();\n"
- file: apps/earthcraft/src/app/explorer.rs
  find: 'ui\.checkbox\(&mut self\.show_flights, lg\.text\("layers-flights-toggle"\)\);'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\n                $&\n                #[cfg(target_arch = \"wasm32\")] super::web::no_flights(ui, lg.text(\"layers-flights-toggle\"));"
- file: apps/earthcraft/src/app/ui/sidebar/layers.rs
  find: 'ui\.checkbox\(&mut self\.show_flights, lg\.text\("layers-flights-toggle"\)\);'
  replace: "#[cfg(not(target_arch = \"wasm32\"))]\n        $&\n        #[cfg(target_arch = \"wasm32\")] crate::app::web::no_flights(ui, lg.text(\"layers-flights-toggle\"));"

# Rules 80-81/81: the globe's raster size. The CPU ray-caster runs on the page's one thread (the desktop spreads it over
# every core), and its cost is the pixel count: up to 2000 px wide, a 1440p window drew at 11 frames a second while
# dragging, with half-second freezes whenever the pointer paused (the full-size draw). On the web the raster is at most
# 560 px wide while the view moves and 1600 px once it settles (egui scales it up to the window); the desktop's limit
# is kept as it is. If upstream renames raster_size or the limit, follow.
- file: crates/earthcraft-render/src/view.rs
  find: 'pub\s+fn\s+raster_size\([^{]*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] let max_width: usize = if idle { 1600 } else { 560 };\n    #[cfg(not(target_arch = \"wasm32\"))] let max_width: usize = MAX_RENDER_WIDTH_PX;"
- file: crates/earthcraft-render/src/view.rs
  find: '\.clamp\(MIN_RENDER_WIDTH_PX,\s*MAX_RENDER_WIDTH_PX\)'
  replace: '.clamp(MIN_RENDER_WIDTH_PX, max_width)'
