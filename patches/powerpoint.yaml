# Rule 6/6: the bridge between the app's web services and `playgroundFiles`.
# What it's for: everything above; this is the only code that talks to the page.
# How: pick_file() uses the explorer for every purpose (open, picture, audio, video); install()
#   fills save_as_async (rule 1) and WEB_WRITE (rule 4), and registers onOpen (?open= and Files' "Open in
#   PowerPoint"). Save As answers go out as `file.saveAs {path}` through the control channel (rule 5).
#   Without playgroundFiles it changes nothing.
# Verify: the browser-storage flows above.
# If upstream changes: this is self-contained; keep it at the end of the web crate's main file and adjust
#   the names it uses (Services fields, ControlRequest, the *_EXTS lists).
- file: apps/*-web/src/web.rs
  find: '$(?![\s\S])'
  before: |

    /// playground (patches/powerpoint.yaml): the bridge between DeckCraft's web services and openplayground's
    /// browser file storage, `globalThis.playgroundFiles` (shell/files.js in github.com/daijro/openplayground).
    mod playground {
        use std::sync::mpsc::Sender;

        use deckcraft_ui_egui::{ControlRequest, Services, SlideApp};
        use wasm_bindgen::{JsCast as _, JsValue, closure::Closure};

        /// Route the app's file services through browser storage. Without the shell (a page not served by
        /// openplayground) nothing changes: the rfd picker and downloads stay.
        pub fn install(services: &mut Services, control: Sender<ControlRequest>, ctx: egui::Context) {
            if api().is_none() {
                log::warn!("playground: no playgroundFiles on this page; keeping downloads");
                return;
            }
            let _ = deckcraft_engine::cmd::file::WEB_WRITE.set(write);
            let c = ctx.clone();
            services.save_as_async = Some(Box::new(move |name: &str, bytes: Vec<u8>| {
                save_as(name, &["deckcraft", "pptx"], &bytes, control.clone(), c.clone(), "file.saveAs");
            }));
            on_open(ctx);
        }

        fn api() -> Option<JsValue> {
            js_sys::Reflect::get(&js_sys::global(), &JsValue::from_str("playgroundFiles")).ok().filter(JsValue::is_object)
        }

        /// `playgroundFiles[method](...args)`; None when the shell is missing or the call threw.
        fn call(method: &str, args: &[JsValue]) -> Option<JsValue> {
            let api = api()?;
            let f = js_sys::Reflect::get(&api, &JsValue::from_str(method)).ok()?.dyn_into::<js_sys::Function>().ok()?;
            f.apply(&api, &args.iter().collect::<js_sys::Array>()).ok()
        }

        fn object(fields: &[(&str, JsValue)]) -> JsValue {
            let o = js_sys::Object::new();
            for (k, v) in fields {
                let _ = js_sys::Reflect::set(&o, &JsValue::from_str(k), v);
            }
            o.into()
        }

        fn list(items: &[&str]) -> JsValue {
            items.iter().map(|s| JsValue::from_str(s)).collect::<js_sys::Array>().into()
        }

        fn field(v: &JsValue, key: &str) -> JsValue {
            js_sys::Reflect::get(v, &JsValue::from_str(key)).unwrap_or(JsValue::UNDEFINED)
        }

        /// Await a promise from `call`: None when missing, rejected, or answered null/undefined (cancelled).
        async fn settle(promise: Option<JsValue>) -> Option<JsValue> {
            let promise = promise?.dyn_into::<js_sys::Promise>().ok()?;
            match wasm_bindgen_futures::JsFuture::from(promise).await {
                Ok(v) if !v.is_null() && !v.is_undefined() => Some(v),
                Ok(_) => None,
                Err(e) => {
                    log::error!("playground: {e:?}");
                    None
                }
            }
        }

        /// WEB_WRITE: hand a `browser:` path's bytes to the store, which saves them in the background.
        fn write(path: &str, bytes: &[u8]) -> Result<(), String> {
            call("write", &[JsValue::from_str(path), js_sys::Uint8Array::from(bytes).into()])
                .map(|_| ())
                .ok_or_else(|| format!("{path}: browser storage isn't available"))
        }

        /// Preserve browser-storage paths so Save writes back to the same document.
        fn file_data(file: &JsValue) -> (String, Vec<u8>) {
            let name = field(file, "path").as_string().or_else(|| field(file, "name").as_string()).unwrap_or_else(|| "Presentation".into());
            (name, js_sys::Uint8Array::new(&field(file, "bytes")).to_vec())
        }

        pub fn file_types(purpose: &str) -> &'static [&'static str] {
            match purpose {
                "picture" => super::PICTURE_EXTS,
                "audio" => super::AUDIO_EXTS,
                "video" => super::VIDEO_EXTS,
                _ => super::PRESENTATION_EXTS,
            }
        }

        /// Leave delivery and cancellation to upstream, which owns the request's target slide.
        pub async fn pick_file(dialog: rfd::AsyncFileDialog, types: &[&str]) -> Option<(String, Vec<u8>)> {
            if api().is_none() {
                let file = dialog.pick_file().await?;
                return Some((file.file_name(), file.read().await));
            }
            let files = settle(call("open", &[object(&[("types", list(types))])])).await?;
            let file = js_sys::Array::from(&files).get(0);
            (!file.is_undefined()).then(|| file_data(&file))
        }

        thread_local! { static OPEN: std::cell::RefCell<Vec<(String, Vec<u8>)>> = const { std::cell::RefCell::new(Vec::new()) }; }

        /// Files supplied by the shell already have their bytes; apply them on the app's next frame.
        pub fn receive(app: &mut SlideApp) {
            for (name, bytes) in OPEN.with(|queue| queue.take()) {
                app.open_or_insert_bytes(&name, &bytes);
            }
        }

        /// Ask Keep / Download. Keep → the app saves to the chosen `browser:` path itself (`command {path}` on
        /// the control channel); Download → the shell has already downloaded `bytes`.
        fn save_as(name: &str, types: &[&str], bytes: &[u8], control: Sender<ControlRequest>, ctx: egui::Context, command: &'static str) {
            let options = object(&[("name", JsValue::from_str(name)), ("types", list(types)), ("bytes", js_sys::Uint8Array::from(bytes).into())]);
            let promise = call("saveAs", &[options]);
            wasm_bindgen_futures::spawn_local(async move {
                let Some(answer) = settle(promise).await else { return };
                let Some(path) = field(&answer, "path").as_string() else { return };
                let (request, _reply) = ControlRequest::new("engine.execute", serde_json::json!({"command": command, "params": {"path": path}}));
                let _ = control.send(request);
                ctx.request_repaint();
            });
        }

        /// Files the shell hands this app: ?open=browser:/… at startup, and "Open in PowerPoint" from Files.
        fn on_open(ctx: egui::Context) {
            let callback = Closure::<dyn FnMut(JsValue)>::new(move |file: JsValue| {
                OPEN.with(|queue| queue.borrow_mut().push(file_data(&file)));
                ctx.request_repaint();
            });
            call("onOpen", &[callback.as_ref().clone()]);
            callback.forget();
        }

        /// Rule A: the app's unsaved state, for the page's leave warning; only sent when it changes.
        pub fn report_unsaved(unsaved: bool) {
            thread_local! { static LAST: std::cell::Cell<Option<bool>> = const { std::cell::Cell::new(None) }; }
            if LAST.with(|last| last.replace(Some(unsaved))) != Some(unsaved) {
                call("setUnsaved", &[JsValue::from_bool(unsaved)]);
            }
        }
    }

# Rule A: tell the page whether there are unsaved changes, for the "Leave site?" warning.
# What it's for: closing the tab or leaving the app warns exactly when there's something unsaved (instead of
#   the shell's guess from recent typing/clicking).
# How: after the app's per-frame logic, report whether any open deck is dirty (the same test as
#   SlideApp::save_all) through playgroundFiles.setUnsaved; the bridge only calls into the page when the
#   value changes.
# Verify: open a deck, edit, close the tab -> the browser asks; save (Ctrl+S), close -> it doesn't.
# If upstream changes: anchor on WebShell's per-frame logic; if the app sets its own beforeunload, delete this.
- file: apps/*-web/src/web.rs
  find: 'self\.app\.logic\(ctx\);'
  replace: |-
    playground::receive(&mut self.app);
            $&
            playground::report_unsaved(self.app.session.documents().iter().any(|d| d.is_dirty()));

# Live editing in Playground sessions (patches/powerpoint/live.diff + patches/live/playground_live.rs)
# What it's for: people in a Playground session edit the session's presentations together (the one open when it started
#   and every one opened since, which reaches the others behind their own) and see each other's presentation, slide,
#   pointer, selection and gestures under way (moves, resizes and rotations as ghosts, shapes and text boxes being drawn,
#   ink and freeform paths), in each person's color.
# The adapter lives in new files: apps/deckcraft-web/src/live.rs (the shared document, merge, Undo, the id allocator,
# presence and its drawing, File › Home's session list; the template is its child module, live/finite.rs writes
# non-finite numbers as 0) and apps/deckcraft-web/src/web/live.rs (the kept runner, and the shell that ends each frame
# with the session's frame hook). These rules only declare them and call in, one
# line each at the end of a file or after a function's signature, the same on both channels. Verify: node
# scripts/build.mjs check powerpoint head|release, then the e2e (tests/live-apps/powerpoint.mjs). If upstream renames a
# function named below, anchor on its new signature; if it renames WebShell or its `app` field, follow it in web/live.rs.
#
# The adapter's module (web, and native tests), and serde for it on every target (its tests run natively) under a target
# spelling nobody else uses.
- live: true
  file: apps/deckcraft-web/src/main.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (patches/live/playground_live.rs).\n#[cfg(any(target_arch = \"wasm32\", test))]\nmod live;\n"
