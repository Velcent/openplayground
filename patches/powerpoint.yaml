# Rule 3/6: an opened browser-storage deck keeps its path, and is never opened twice.
# What it's for: so Save writes back to the file it was opened from, and so two documents never share one
#   stored file (the second would silently overwrite the first on Save).
# How: files arrive as file.openBytes {name, data}; the bridge (rule 6) names browser-storage files by their
#   `browser:` path, which open_bytes now keeps as the deck's path (it passed None). The title is still the
#   file's stem. If a document already has that path, open_bytes switches to it instead of adding another
#   (the open deck may hold unsaved edits that the stored copy lacks).
# Verify: Open a stored deck from the explorer, Ctrl+S: no dialog, and the stored file changes. Open the same
#   one again (Ctrl+O, or "Open in PowerPoint" from Files): the open deck is shown, no new tab.
# If upstream changes: anchor on where opened bytes become a document.
- file: crates/engine/src/cmd/file.rs
  find: 'let i = add_opened\(s, name, None, doc\);'
  replace: |-
    // playground (patches/powerpoint.yaml): a browser-storage deck keeps its `browser:` path; one already open is switched to.
        if name.starts_with("browser:")
            && let Some(i) = s.documents().iter().position(|d| d.path.as_deref() == Some(name))
        {
            s.set_active(i);
            return Ok(json!({"document": i}));
        }
        let i = add_opened(s, name, name.starts_with("browser:").then(|| name.to_string()), doc);

# Rule 4/6: where the engine writes `browser:` paths in the browser build.
# What it's for: the engine's save ends in write_file, which in the browser build was an error stub. Now a
#   `browser:` path's bytes go to playgroundFiles.write; other paths still error.
# How: WEB_WRITE is a fn pointer the bridge (rule 6) sets; the engine crate needs no new dependency.
# Verify: rule 2's flow stores the deck; a silent Save changes it.
# Match the old wasm error stub or the newer shared I/O wrapper; keep its fallback and native writes intact.
# If upstream changes: put the hook wherever the wasm build's "write bytes to a path" lives.
- file: crates/engine/src/cmd/file.rs
