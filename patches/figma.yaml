# Seed the browser app's theme from prefers-color-scheme; later in-app picks remain untouched.
- file: apps/figcraft-web/src/web.rs
  find: 'let mut session = Session::new\(\);'
  after: |

    let dark = web_sys::window().and_then(|w| w.match_media("(prefers-color-scheme: dark)").ok().flatten()).is_some_and(|m| m.matches());
    session.prefs.theme = if dark { "dark" } else { "light" }.into();

# Live editing in Playground sessions (patches/figma/live.diff + patches/live/playground_live.rs)
# What it's for: people in a Playground session edit one design together and see each other's pointer and selected
#   layers on the page they look at, in each person's color.
# How: the adapter lives in new files: crates/engine/src/live_playground.rs (the shared document, which is the
#   collaboration core's snapshot, merge, adopt, Undo, presence; it declares the template, copied next to it),
#   crates/ui-egui/src/live/playground.rs (this person's pointer, and the others' drawn with a native live session's
#   pointer, name tag and outline) and apps/figcraft-web/src/web/playground.rs (the kept runner and the app that ends
#   each frame with the session's frame hook). These rules only declare them and call in, each one line at the end of
#   a file or right after a function's signature.
# Verify: node scripts/build.mjs check figma head|release (and LIVE=0), then the e2e (tests/live-apps/figma.mjs) and
#   `cargo test -p figcraft-engine --lib live_playground`.
# If upstream changes: if a function named below is renamed, anchor on its new signature; if WebShell or its `fig`
#   field is renamed, follow it in web/playground.rs.
#
# The engine's adapter module (web, and its native tests), and the template's wasm dependencies under a target
# spelling nobody else uses.
- live: true
  file: crates/engine/src/lib.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only).\n#[cfg(any(target_arch = \"wasm32\", test))]\npub mod live_playground;\n"
- live: true
  file: crates/engine/Cargo.toml
  find: '(?![\s\S])'
  after: "\n[target.'cfg(all(target_arch = \"wasm32\"))'.dependencies]\njs-sys = \"0.3\"\nwasm-bindgen = \"0.2\"\n"
# Session::undo and Session::redo: in the shared document they go to the session.
- live: true
  file: crates/engine/src/lib.rs
  find: 'pub\s+fn\s+undo\s*\(\s*&mut\s+self\s*\)[^{]*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if crate::live_playground::undo(self, false) { return Ok(true); }"
- live: true
  file: crates/engine/src/lib.rs
  find: 'pub\s+fn\s+redo\s*\(\s*&mut\s+self\s*\)[^{]*\{'
  after: "\n        #[cfg(any(target_arch = \"wasm32\", test))] if crate::live_playground::undo(self, true) { return Ok(true); }"
# Branches, refused in a native live session, are refused in the shared document too (their id spaces are per file).
- live: true
  file: crates/engine/src/branches.rs
  find: 'fn\s+refuse_live\s*\([^{]*\{'
  after: "\n    #[cfg(any(target_arch = \"wasm32\", test))] crate::live_playground::refuse_branches(s, cmd, uid)?;"
# The canvas's live drawing (others' cursors and selections), which first hands this person's pointer to the session
# and draws the others in it.
- live: true
  file: crates/ui-egui/src/live.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session (web only).\n#[cfg(target_arch = \"wasm32\")]\nmod playground;\n"
- live: true
  file: crates/ui-egui/src/live.rs
  find: 'pub\s+fn\s+draw\s*\([^{]*\{'
  after: "\n    #[cfg(target_arch = \"wasm32\")] playground::draw(app, painter);"
# The web entry keeps its runner for the adapter and wraps its app (web/playground.rs, a child module so it reaches
# WebShell's fields).
- live: true
  file: apps/figcraft-web/src/web.rs
  find: '(?![\s\S])'
  after: "\n// Live editing in a Playground session.\nmod playground;\n"
- live: true
  file: apps/figcraft-web/src/web.rs
  find: 'eframe::WebRunner::new\(\)'
  replace: 'playground::runner()'
- live: true
  file: apps/figcraft-web/src/web.rs
  find: 'Ok\(Box::new\((?=\s*WebShell\b)'
  replace: 'Ok(playground::wrap('
