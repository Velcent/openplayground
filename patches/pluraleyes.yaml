# Align in the browser. Upstream (github.com/FedyaLight/align) releases desktop packages only, and its desktop app is
# built with GPUI, which has no browser backend; these patches add a web build of its engine with a page of its own,
# from its head commit.
#
# The engine (crates/align-core and align-decode, unchanged but for the rules below) runs in a worker as a WASI module
# (wasm32-wasip1), so its files and clock work against the page's files. patches/pluraleyes/web.diff adds new files
# only:
#   scripts/build-web.sh             build.mjs runs it: cargo builds apps/align-web for wasm32-wasip1 with the
#                                    workspace's Cargo.lock; the page (apps/align-web/www) needs no build step.
#   apps/align-web/src/lib.rs        the module's exports: inspect the media, synchronize (progress and each clip's
#                                    waveform reported as it goes) and export the result as editor timelines, with
#                                    their media pointed at a folder on the user's computer (the page's paths start at
#                                    Files, which isn't where an editor finds the media).
#   apps/align-web/src/lanes.rs      the desktop app's lane layout (crates/align-gpui/src/lane.rs) without GPUI.
#   apps/align-web/www/              the page: Align's workflow and look (add a shoot, Synchronize, the V and A lanes,
#                                    Quality, Export), media from Files ("A-CAM › A001.MOV" is /A-CAM/A001.MOV, a device
#                                    of its own) or the computer (files or folders, picked or dropped, read where the
#                                    engine needs them and never copied into Files), "Open in Align", and exports kept
#                                    in Files or downloaded as one ZIP; the worker, on WASI over an in-memory file
#                                    system (wasi.js, as Retake's, plus Blob-backed files read with FileReaderSync).
# Not in the browser: MTS, MXF and R3D (they decode through an FFmpeg process), AAF (a Python helper), and the
# desktop app's own settings, path fixer and imported timelines.

# Rules 1-2/6: 32-bit wasm. `prev_pow2` shifts a usize by 32, which overflows on 32 bits (a compile error there);
# checked_shr gives 0 there and the same result on 64 bits. If upstream rewrites prev_pow2, check it still compiles
# for wasm32 and drop these rules if so.
- file: crates/align-core/src/fine.rs
  find: '^(\s*)v \|= v >> 32;'
  replace: '$1v |= v.checked_shr(32).unwrap_or(0);'
- file: crates/align-core/src/gccphat.rs
  find: '^(\s*)v \|= v >> 32;'
  replace: '$1v |= v.checked_shr(32).unwrap_or(0);'

# Rule 3/6: a page's worker has one thread (WASI can't start threads): par_map maps in order. Anchored on par_map's
# bounds; if they change, keep the early return first in its body.
- file: crates/align-core/src/parallel.rs
  find: 'F: Fn\(&T\) -> R \+ Send \+ Sync,\n\{'
  after: "\n    // Playground's browser build: one thread (patches/pluraleyes.yaml).\n    #[cfg(target_arch = \"wasm32\")]\n    return items.iter().map(&f).collect();"

# Rules 4-6/6: WASI has no process id (std::process::id panics there); the modules that name temporary files with it
# take `std` from a module of their own whose process::id is 1 (a local `std` shadows the standard library's name in
# that module; everything else still comes from the real std). If upstream uses process::id in another module, give
# it the same block; a missing one panics while synchronizing or exporting.
- file: crates/align-core/src/cache.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: WASI has no process id; the cache's temporary names use 1 (patches/pluraleyes.yaml).\n#[cfg(target_arch = \"wasm32\")]\nmod std {\n    pub use ::std::*;\n    pub mod process {\n        pub use ::std::process::*;\n        pub fn id() -> u32 {\n            1\n        }\n    }\n}\n"
- file: crates/align-decode/src/export.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: WASI has no process id; temporary names use 1 (patches/pluraleyes.yaml).\n#[cfg(target_arch = \"wasm32\")]\nmod std {\n    pub use ::std::*;\n    pub mod process {\n        pub use ::std::process::*;\n        pub fn id() -> u32 {\n            1\n        }\n    }\n}\n"
- file: crates/align-decode/src/render.rs
  find: '(?![\s\S])'
  after: "\n// Playground's browser build: WASI has no process id; temporary names use 1 (patches/pluraleyes.yaml).\n#[cfg(target_arch = \"wasm32\")]\nmod std {\n    pub use ::std::*;\n    pub mod process {\n        pub use ::std::process::*;\n        pub fn id() -> u32 {\n            1\n        }\n    }\n}\n"
