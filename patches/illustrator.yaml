# Rule 8/11: a font menu sample waits for its font.
# What it's for: rows of installed families showed their sample in the stand-in (Source Sans 3), cached for
#   good, so every installed font looked the same.
# How: on the web, a sample whose family isn't loaded yet draws nothing (rule 2 has started loading it); rule 9
#   tries those again when fonts arrive.
# Verify: open the font menu with the fonts allowed: each row's sample shows in its own font a moment later.
# If upstream changes: anchor on render_sample's face lookup.
- file: crates/ui-egui/src/font_menu.rs
  find: 'let face: Arc<vectorcraft_text::FontFace> = db\.face\(family, style\)\?;'
  after: |2-

        // playground (patches/illustrator.yaml): a browser font still loading: its sample comes when it arrives.
        #[cfg(target_arch = "wasm32")]
