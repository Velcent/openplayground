            return None;
        }

# Rule 9/11: samples drawn while their font loaded are drawn again when fonts arrive.
# What it's for: rule 8's empty samples fill in.
# How: on the web, when the font database's generation changes, the sample cache forgets its empty entries.
# Verify: rule 8's.
# If upstream changes: anchor on the start of sample_texture's cache lookup.
- file: crates/ui-egui/src/font_menu.rs
  find: 'let mut s = s\.borrow_mut\(\);(?=\s*if let Some\(t\) = s\.ready\.get\(&key\))'
  after: |2-

            // playground (patches/illustrator.yaml): fonts arrived: samples that had none are drawn again.
            #[cfg(target_arch = "wasm32")]
            {
                thread_local! { static FONTS: std::cell::Cell<u64> = const { std::cell::Cell::new(0) }; }
                let generation = vectorcraft_text::FontDb::global().generation();
                if FONTS.with(|f| f.replace(generation)) != generation {
                    s.ready.retain(|_, t| t.is_some());
                }
            }

# Live editing in Playground sessions (patches/illustrator/live.diff + the playground-live crate, tools.yaml `live_kit`)
